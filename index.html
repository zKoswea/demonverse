<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DemonVerse</title>

  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 18px 30px;
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      white-space: nowrap;
    }

    .logo .red {
      color: #d62828;
    }

    .subtitle {
      font-size: 13px;
      font-weight: 500;
      color: #777;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* DISCORD BUTTON */

    .discord-button {
      margin-left: auto;
      background: #5865f2;
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;

      display: flex;
      align-items: center;
      gap: 8px;

      box-shadow:
        0 0 5px rgba(255, 255, 255, 0.18);
      transition:
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .discord-button img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .discord-button:hover {
      background: #4752c4;

      box-shadow:
        0 0 7px rgba(255, 255, 255, 0.28);
    }

    /* SEARCH */

    .search-container {
      max-width: 1200px;
      margin: 25px auto 0;
      padding: 0 20px;
    }

    #search {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    #search:focus {
      border-color: #999;
    }

    /* LIST */

    .list-container {
      max-width: 1200px;
      margin: 20px auto 50px;
      padding: 0 20px;
    }

    .list-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    /* LEVEL CARD */

    .level-card {
      display: flex;
      width: 100%;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      margin-bottom: 18px;
      min-height: 190px;
    }

    .left-side {
      width: 65%;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .rank {
      font-size: 18px;
      font-weight: 700;
      min-width: 35px;
      text-align: center;
    }

    .thumbnail {
      width: 250px;
      height: 145px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .level-details {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .level-name {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .detail-line {
      font-size: 16px;
      font-weight: 500;
    }

    .detail-line strong {
      font-weight: 600;
    }

    /* DIVIDER */

    .divider {
      width: 1px;
      background: #ddd;
      margin: 20px 0;
    }

    /* RIGHT SIDE */

    .right-side {
      width: 35%;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      margin-left: auto;
    }

    .right-title {
      color: #d22b2b;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .right-info {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .right-info strong {
      font-weight: 600;
    }

    .verification-button {
      display: inline-block;
      margin-top: 5px;
      padding: 12px 28px;
      background: #d22b2b;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
    }

    .verification-button:hover {
      background: #b92323;
    }

    /* #1 GOLD GLOW */

    .gold-glow {
      box-shadow:
        0 0 8px rgba(255, 196, 0, 0.55),
        0 0 18px rgba(255, 196, 0, 0.35);
    }

    /* #4-#10 WHITE/GREY GLOW */

    .white-glow {
      box-shadow:
        0 0 7px rgba(150, 150, 150, 0.45),
        0 0 15px rgba(190, 190, 190, 0.25);
    }

    /* FOOTER */

    footer {
      text-align: center;
      padding: 30px;
      color: #888;
      font-size: 13px;
    }

    /* IMAGE MODAL */

    .image-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .image-modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 8px;
    }

    .image-modal .close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 40px;
      cursor: pointer;
      font-weight: 300;
    }

    /* MOBILE */

    @media (max-width: 900px) {

      header {
        flex-wrap: wrap;
        gap: 12px;
      }

      .subtitle {
        width: 100%;
        order: 3;
      }

      .discord-button {
        margin-left: auto;
      }

      .left-side {
        width: 100%;
        flex-wrap: wrap;
        padding: 18px;
      }

      .divider {
        width: calc(100% - 36px);
        height: 1px;
        margin: 0 18px;
      }

      .right-side {
        width: 100%;
        padding: 20px 18px 25px;
        margin-left: 0;
      }

      .level-card {
        flex-wrap: wrap;
      }

      .thumbnail {
        width: 220px;
        height: 128px;
      }
    }

    @media (max-width: 600px) {

      .level-name {
        font-size: 23px;
      }

      .thumbnail {
        width: 100%;
        height: auto;
        max-height: 200px;
      }

      .left-side {
        align-items: flex-start;
      }

      .rank {
        min-width: 30px;
      }
    }
  </style>
</head>

    /* =========================================
       CREATE LEVEL CARD
    ========================================= */

    function createLevelCard(level, index) {

      const rank = index + 1;

      let glowClass = "";

      if (rank === 1) {
        glowClass = "gold-glow";
      }

      if (rank >= 4 && rank <= 10) {
        glowClass = "white-glow";
      }

      const firstVictor =
        firstVictors[rank] || "Not added";

      const objects =
        level.objects || "Not added";


      return `

        <div class="level-card ${glowClass}">

          <div class="left-side">

            <div class="rank">
              #${rank}
            </div>


            <img
              src="${level.image}"
              alt="${level.name}"
              class="thumbnail"
              onclick="openModal('${level.image}')"
            >


            <div class="level-details">

              <div class="level-name">
                ${level.name}
              </div>


              <div class="detail-line">
                <strong>Hosted by:</strong>
                ${level.host}
              </div>


              <div class="detail-line">
                <strong>Verified by:</strong>
                ${level.verifier}
              </div>


              <div class="detail-line">
                <strong>First Victor:</strong>
                ${firstVictor}
              </div>

            </div>

          </div>


          <div class="divider"></div>


          <div class="right-side">

            <div class="right-title">
              LEVEL INFO
            </div>


            <div class="right-info">
              <strong>Level ID:</strong>
              ${level.id}
            </div>


            <div class="right-info">
              <strong>Length:</strong>
              ${level.length}
            </div>


            <div class="right-info">
              <strong>Objects:</strong>
              ${objects}
            </div>


            <a
              href="${level.verification}"
              target="_blank"
              class="verification-button"
            >
              ▶ Verification Video
            </a>

          </div>

        </div>

      `;

    }


    /* =========================================
       DISPLAY LEVELS
    ========================================= */

    function displayLevels(levelArray) {

      const list =
        document.getElementById("level-list");

      list.innerHTML = "";


      levelArray.forEach(level => {

        const originalIndex =
          levels.indexOf(level);

        list.innerHTML +=
          createLevelCard(
            level,
            originalIndex
          );

      });

    }


    /* =========================================
       SEARCH
    ========================================= */

    document
      .getElementById("search")
      .addEventListener(
        "input",
        function() {

          const searchTerm =
            this.value.toLowerCase();


          const filteredLevels =
            levels.filter(level =>
              level.name
                .toLowerCase()
                .includes(searchTerm)
            );


          displayLevels(
            filteredLevels
          );

        }
      );


    /* =========================================
       IMAGE MODAL
    ========================================= */

    function openModal(image) {

      const modal =
        document.getElementById(
          "imageModal"
        );


      const modalImage =
        document.getElementById(
          "modalImage"
        );


      modalImage.src = image;

      modal.style.display = "flex";

    }


    function closeModal() {

      document.getElementById(
        "imageModal"
      ).style.display = "none";

    }


    document
      .getElementById("closeModal")
      .addEventListener(
        "click",
        closeModal
      );


    document
      .getElementById("imageModal")
      .addEventListener(
        "click",
        function(event) {

          if (
            event.target === this
          ) {

            closeModal();

          }

        }
      );


    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape"
        ) {

          closeModal();

        }

      }
    );


    /* =========================================
       INITIAL DISPLAY
    ========================================= */

    displayLevels(levels);

  </script>
