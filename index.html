<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DemonVerse</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    .discord-button {
      position: absolute;
      top: 24px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px 24px;
      background: #5865F2;
      color: white;
      text-decoration: none;
      font-size: 21px;
      font-weight: bold;
      border-radius: 8px;
      transition: background 0.2s, transform 0.2s;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    }

    .discord-button:hover {
      background: #4752C4;
      transform: translateY(-1px);
    }

    .discord-button svg {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      fill: white;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    /* HEADER */

    header {
      background: white;
      border-bottom: 4px solid #c62828;
      padding: 28px 20px;
    }

    .header-content {
      max-width: 1250px;
      margin: auto;
      position: relative;
      min-height: 86px;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: #c62828;
    }

    .subtitle {
      margin-top: 6px;
      color: #777;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* MAIN */

    main {
      max-width: 1250px;
      margin: auto;
      padding: 35px 20px 60px;
    }

    /* SEARCH */

    .search-container {
      margin-bottom: 28px;
    }

    #search {
      width: 100%;
      max-width: 520px;
      padding: 14px 17px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: white;
    }

    #search:focus {
      outline: none;
      border-color: #c62828;
    }

    /* TITLE */

    .list-title {
      font-size: 25px;
      font-weight: bold;
      padding-left: 13px;
      border-left: 5px solid #c62828;
      margin-bottom: 22px;
    }

    /* LEVEL CARD */

    .level-card {
      display: flex;
      align-items: stretch;
      background: white;
      border: 1px solid #dddddd;
      border-radius: 9px;
      margin-bottom: 18px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .level-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }

    /* RANK */

    .rank {
      width: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      background: #fafafa;
      border-right: 1px solid #dddddd;
      flex-shrink: 0;
    }

    /* LEFT SIDE */

    .left-section {
      display: flex;
      flex: 1;
      padding: 16px;
      gap: 20px;
      min-width: 0;
    }

    /* THUMBNAIL */

    .thumbnail {
      width: 300px;
      height: 170px;
      object-fit: cover;
      border-radius: 6px;
      background: #e4e4e4;
      border: 1px solid #d5d5d5;
      flex-shrink: 0;
    }

    .thumbnail-placeholder {
      width: 300px;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e4e4e4;
      color: #999;
      border-radius: 6px;
      border: 1px solid #d5d5d5;
      flex-shrink: 0;
    }

    /* LEVEL DETAILS */

    .level-details {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .level-name {
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 15px;
      word-break: break-word;
    }

    .detail-line {
      font-size: 16px;
      margin-bottom: 9px;
      color: #555;
    }

    .detail-line strong {
      color: #222;
    }

    /* DIVIDER */

    .divider {
      width: 1px;
      background: #dddddd;
      margin: 16px 0;
      flex-shrink: 0;
    }

    /* RIGHT SIDE */

    .right-section {
      width: 250px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex-shrink: 0;
    }

    .right-title {
      color: #c62828;
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .right-info {
      font-size: 15px;
      color: #555;
      margin-bottom: 11px;
    }

    .right-info strong {
      color: #222;
    }

    /* VERIFICATION BUTTON */

    .verification-button {
      display: block;
      margin-top: 8px;
      padding: 10px 12px;
      text-align: center;
      text-decoration: none;
      background: #c62828;
      color: white;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .verification-button:hover {
      background: #a91f1f;
    }

    .no-verification {
      display: block;
      margin-top: 8px;
      padding: 10px 12px;
      text-align: center;
      background: #eeeeee;
      color: #999;
      border-radius: 6px;
      font-weight: bold;
    }

    /* TOP RANK GLOWS */

    /* #1 GOLD */

    .rank-1 {
      border-color: #d4af37;
      box-shadow:
        0 0 20px rgba(212,175,55,0.65),
        0 3px 12px rgba(0,0,0,0.08);
    }

    .rank-1 .rank {
      background: #fffaf0;
      color: #b8860b;
    }

    /* #2-#3 SILVER */

    .rank-silver {
      border-color: #b8b8b8;
      box-shadow:
        0 0 18px rgba(180,180,180,0.7),
        0 3px 12px rgba(0,0,0,0.08);
    }

    .rank-silver .rank {
      background: #fafafa;
      color: #777;
    }

    /* #4-#10 WHITE/GREY */

    .rank-top {
      border-color: #dddddd;
      box-shadow:
        0 0 15px rgba(180,180,180,0.55),
        0 3px 10px rgba(0,0,0,0.07);
    }

    /* FOOTER */

    footer {
      background: white;
      border-top: 1px solid #dddddd;
      padding: 30px 20px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    /* MOBILE */

    @media (max-width: 900px) {
      .level-card {
        flex-wrap: wrap;
      }

      .rank {
        width: 60px;
      }

      .left-section {
        width: calc(100% - 60px);
      }

      .divider {
        width: calc(100% - 32px);
        height: 1px;
        margin: 0 16px;
      }

      .right-section {
        width: 100%;
        padding: 20px;
      }
    }

    @media (max-width: 700px) {
      .logo {
        font-size: 35px;
      }

      main {
        padding: 25px 12px 50px;
      }

      .level-card {
        display: block;
      }

      .rank {
        width: 100%;
        height: 48px;
        border-right: none;
        border-bottom: 1px solid #dddddd;
      }

      .left-section {
        width: 100%;
        flex-direction: column;
      }

      .thumbnail,
      .thumbnail-placeholder {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
      }

      .divider {
        width: calc(100% - 32px);
      }

      .right-section {
        width: 100%;
      }

      .header-content {
        padding-bottom: 74px;
      }

      .discord-button {
        top: auto;
        right: 20px;
        bottom: 0;
      }
    }
  </style>
</head>

    const levelList =
      document.getElementById("level-list");


    function createLevelCard(level, index) {

      const rank = index + 1;

      const card =
        document.createElement("div");

      card.className = "level-card";


      /* RANK GLOWS */

      if (rank === 1) {

        card.classList.add("rank-1");

      }

      else if (rank === 2 || rank === 3) {

        card.classList.add("rank-silver");

      }

      else if (rank >= 4 && rank <= 10) {

        card.classList.add("rank-top");

      }


      /* THUMBNAIL */

      let thumbnailHTML;

      if (
        level.thumbnail &&
        level.thumbnail.trim() !== ""
      ) {

        thumbnailHTML = `
          <img
            class="thumbnail"
            src="${level.thumbnail}"
            alt="${level.name}"
          >
        `;

      }

      else {

        thumbnailHTML = `
          <div class="thumbnail-placeholder">
            No Thumbnail
          </div>
        `;

      }


      /* VERIFICATION */

      let verificationHTML;

      if (
        level.verification &&
        level.verification.trim() !== ""
      ) {

        verificationHTML = `
          <a
            href="${level.verification}"
            target="_blank"
            class="verification-button"
          >
            ▶ Verification Video
          </a>
        `;

      }

      else {

        verificationHTML = `
          <div class="no-verification">
            No Verification Link
          </div>
        `;

      }


      /* CARD */

      card.innerHTML = `

        <div class="rank">
          #${rank}
        </div>


        <div class="left-section">

          ${thumbnailHTML}


          <div class="level-details">

            <div class="level-name">
              ${level.name}
            </div>


            <div class="detail-line">
              <strong>Hosted by:</strong>
              ${level.host}
            </div>


            <div class="detail-line">
              <strong>Verified by:</strong>
              ${level.verifier}
            </div>

          </div>

        </div>


        <div class="divider"></div>


        <div class="right-section">

          <div class="right-title">
            Level Info
          </div>


          <div class="right-info">
            <strong>Level ID:</strong>
            ${level.levelID}
          </div>


          <div class="right-info">
            <strong>Length:</strong>
            ${level.length}
          </div>


          ${verificationHTML}

        </div>

      `;


      return card;

    }


    /* DISPLAY LEVELS */

    function displayLevels(levelArray) {

      levelList.innerHTML = "";


      levelArray.forEach(
        (level, index) => {

          const originalIndex =
            levels.indexOf(level);


          const card =
            createLevelCard(
              level,
              originalIndex
            );


          levelList.appendChild(card);

        }
      );

    }


    /* SEARCH */

    const search =
      document.getElementById("search");


    search.addEventListener(
      "input",
      function() {

        const searchText =
          search.value
            .toLowerCase()
            .trim();


        const filteredLevels =
          levels.filter(
            level =>
              level.name
                .toLowerCase()
                .includes(searchText)
          );


        displayLevels(filteredLevels);

      }
    );


    /* START WEBSITE */

    displayLevels(levels);

  </script>
