<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DemonVerse | Geometry Dash Demon List</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 20px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
    }

    .logo span {
      color: #c62828;
    }

    nav {
      display: flex;
      gap: 10px;
    }

    nav a {
      text-decoration: none;
      color: #222;
      background: #f7f7f7;
      border: 1px solid #ddd;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
    }

    nav a:hover {
      background: #e9e9e9;
    }

    .hero {
      text-align: center;
      padding: 55px 20px 30px;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .hero p {
      color: #666;
      font-size: 17px;
    }

    #search {
      display: block;
      width: min(560px, 90%);
      margin: 28px auto 0;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .list {
      width: min(1050px, 92%);
      margin: 0 auto 60px;
    }

    .level-card {
      position: relative;
      display: flex;
      gap: 22px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .thumbnail {
      width: 290px;
      height: 165px;
      flex-shrink: 0;
      border-radius: 8px;
      background: #ddd;
      object-fit: cover;
      border: 1px solid #ccc;
    }

    .thumbnail-placeholder {
      width: 290px;
      height: 165px;
      flex-shrink: 0;
      border-radius: 8px;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-weight: bold;
      border: 1px solid #ccc;
    }

    .level-info {
      padding: 5px 10px 5px 0;
      flex: 1;
    }

    .level-title {
      margin: 0 0 12px;
      font-size: 28px;
      padding-right: 120px;
    }

    .rank {
      color: #c62828;
    }

    .level-info p {
      margin: 8px 0;
      color: #555;
      font-size: 16px;
    }

    .level-info strong {
      color: #222;
    }

    .points {
      display: inline-block;
      margin-top: 8px;
      background: #f0f0f0;
      padding: 8px 12px;
      border-radius: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    .verification-link {
      position: absolute;
      top: 18px;
      right: 20px;
      text-decoration: none;
      color: #c62828;
      font-weight: bold;
      font-size: 14px;
    }

    .verification-link:hover {
      text-decoration: underline;
    }

    .footer {
      text-align: center;
      padding: 30px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 750px) {
      header {
        padding: 15px 5%;
      }

      .logo {
        font-size: 22px;
      }

      nav a {
        padding: 8px 10px;
        font-size: 13px;
      }

      .level-card {
        flex-direction: column;
      }

      .thumbnail,
      .thumbnail-placeholder {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
      }

      .level-title {
        padding-right: 0;
        font-size: 23px;
      }

      .verification-link {
        position: static;
        display: inline-block;
        margin-bottom: 12px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Demon<span>Verse</span></div>

    <nav>
      <a href="#list">Demon List</a>
      <a href="stats.html">Stats Viewer</a>

      <!-- CHANGE THIS TO YOUR DISCORD INVITE LINK -->
      <a href="YOUR_DISCORD_LINK_HERE" target="_blank">Discord</a>
    </nav>
  </header>


  <section class="hero">
    <h1>DemonVerse Demon List</h1>

    <p>Ranking the Top 75 Hardest Geometry Dash Demons.</p>

    <input
      type="text"
      id="search"
      placeholder="Search for a level..."
    >
  </section>


  <main class="list" id="list"></main>


  <div class="footer">
    DemonVerse • Community Geometry Dash Demon List
  </div>


  <script>

    /*
    ============================================================
    EDIT YOUR LEVELS HERE
    ============================================================

    Each level has:

{
    name:
    host:
    verifier:
    points:
    thumbnail:
    verification:
}

    THUMBNAIL:
    Put an image link inside the quotation marks.

    VERIFICATION:
    Put the YouTube verification link inside the quotation marks.

    Example:

    {
      name: "Society",
      host: "Neomorbian",
      verifier: "Zoink",
      points: 1000,
      thumbnail: "https://example.com/image.jpg",
      verification: "https://youtube.com/..."
    },

    ============================================================
    */


    const levels = [

      // ====================
      // TOP 1
      // ====================

      {
        name: "Society",
        host: "Neomarbilan",
        verifier: "wPopoff",
        points: 1000,
        thumbnail: "https://zkoswea.github.io/demonverse/tt9fnfisaq0h1.jpeg",
        verification: "https://www.youtube.com/watch?v=3CoEaH1CM7o"
      },


      // ====================
      // TOP 2
      // ====================

      {
        name: "Example Level",
        host: "Example Creator",
        verifier: "Example Player",
        points: 950,
        thumbnail: "",
        verification: ""
      },


      // ====================
      // TOP 3
      // ====================

      {
        name: "Example Level",
        host: "Example Creator",
        verifier: "Example Player",
        points: 900,
        thumbnail: "",
        verification: ""
      }

    ];


    /*
    ============================================================
    AUTOMATICALLY CREATE THE REST OF THE 75 LEVELS
    ============================================================

    You do NOT need to touch this section.

    The website will automatically create empty spots
    until there are exactly 75 levels.
    */


    while (levels.length < 75) {

      const rank = levels.length + 1;

      levels.push({

        name: `Level #${rank}`,
        host: "Unknown",
        verifier: "Unknown",
        points: Math.max(1, 1000 - ((rank - 1) * 12)),
        thumbnail: "",
        verification: ""

      });

    }


    const list = document.getElementById("list");


    function renderLevels(levelArray) {

      list.innerHTML = "";

      levelArray.forEach((level, index) => {

        const rank = levels.indexOf(level) + 1;


        const card = document.createElement("div");

        card.className = "level-card";


        let thumbnailHTML;


        if (level.thumbnail && level.thumbnail.trim() !== "") {

          thumbnailHTML = `
            <img
              class="thumbnail"
              src="${level.thumbnail}"
              alt="${level.name}"
            >
          `;

        } else {

          thumbnailHTML = `
            <div class="thumbnail-placeholder">
              Level Thumbnail
            </div>
          `;

        }


        let verificationHTML = "";


        if (
          level.verification &&
          level.verification.trim() !== ""
        ) {

          verificationHTML = `
            <a
              class="verification-link"
              href="${level.verification}"
              target="_blank"
            >
              ▶ Verification ↗
            </a>
          `;

        }


        card.innerHTML = `

          ${verificationHTML}

          ${thumbnailHTML}

          <div class="level-info">

            <h2 class="level-title">

              <span class="rank">
                #${rank}
              </span>

              ${level.name}

            </h2>


            <p>

              <strong>Hosted by:</strong>

              ${level.host}

            </p>


            <p>

              <strong>Verified by:</strong>

              ${level.verifier}

            </p>


            <div class="points">

              ${level.points} Points

            </div>

          </div>

        `;


        list.appendChild(card);

      });

    }


    renderLevels(levels);


    /*
    ============================================================
    SEARCH BAR
    ============================================================
    */


    document
      .getElementById("search")
      .addEventListener("input", function () {

        const searchText =
          this.value.toLowerCase();


        const filteredLevels =
          levels.filter(level =>

            level.name
              .toLowerCase()
              .includes(searchText)

          );


        renderLevels(filteredLevels);

      });


  </script>

</body>
</html>
