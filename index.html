@media (max-width: 900px) {
}
@media (max-width: 600px) {
}

.level-card {

/* THUMBNAILS — FULL IMAGE, NO CROPPING/ZOOMING */

.thumbnail {

flex-shrink: 0;

}

.level-details {

}

.level-name {

}

.detail-line {
font-size: 16px;
font-weight: 500;
}

.detail-line strong {

}

.divider {

}

.right-side {

flex-shrink: 0;
padding: 25px 20px 25px 10px;

justify-content: center;

}

.right-title {
color: #d22b2b;

font-weight: 600;
margin-bottom: 16px;
}

.right-info {

}

}

.verification-button {
display: inline-flex;
align-items: center;
justify-content: center;

padding: 12px 20px;

}

.verification-button .play-icon {

height: 0;

.verification-button:hover {

}

.gold-glow {
box-shadow:
0 0 8px rgba(255, 196, 0, 0.55),

}

.white-glow {

0 0 7px rgba(150, 150, 150, 0.45),

}

.blank-level .level-details,
.blank-level .right-side {
visibility: hidden;
}

footer {
text-align: center;
padding: 30px;
color: #888;
font-size: 13px;
}

.image-modal {
display: none;
position: fixed;
z-index: 1000;
inset: 0;
background: rgba(0,0,0,0.85);
align-items: center;
justify-content: center;
padding: 30px;
}

.image-modal img {
width: min(90vw, 1200px);
height: min(82vh, 760px);
max-width: 100%;
max-height: 100%;
object-fit: contain;
border-radius: 8px;
background: rgba(0, 0, 0, 0.15);
}

.image-modal .close {
position: absolute;
top: 20px;
right: 30px;
color: white;
font-size: 40px;
cursor: pointer;
font-weight: 300;
}

    .theme-toggle {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid #d5d5d5;
      border-radius: 50%;
      background: #f4f4f4;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }
    .theme-toggle:hover { transform: rotate(-8deg) scale(1.05); }
    .theme-toggle svg { width: 22px; height: 22px; display: block; }
    .theme-toggle .moon-icon { display: block; fill: #000; }
    .theme-toggle .sun-icon { display: none; fill: #fff; }

    body.dark-mode {
      background: #101010;
      color: #f3f3f3;
      color-scheme: dark;
    }
    body.dark-mode header { background: #171717; border-bottom-color: #333; }
    body.dark-mode .subtitle { color: #aaa; }
    body.dark-mode .theme-toggle { background: #090909; border-color: #555; }
    body.dark-mode .theme-toggle .moon-icon { display: none; }
    body.dark-mode .theme-toggle .sun-icon { display: block; }
    body.dark-mode #search { background: #1d1d1d; color: #f5f5f5; border-color: #444; color-scheme: dark; }
    body.dark-mode #search::placeholder { color: #aaa; }
    body.dark-mode .level-card { background: #191919; border-color: #383838; box-shadow: 0 2px 8px rgba(0,0,0,.28); }

      box-shadow:
        0 0 8px rgba(255, 196, 0, 0.65),

        0 0 30px rgba(255, 196, 0, 0.22);
    }
    body.dark-mode .thumbnail { background-color: #252525; }
    body.dark-mode .blank-thumbnail { background: #202020; border-color: #555; }
    body.dark-mode .divider { background: #393939; }
    body.dark-mode footer { color: #999; }

.left-side {

.verification-button {

/* Language selector and flag icons */
.language-picker {
  position: relative;
  flex: 0 0 auto;
  z-index: 150;
}
.language-trigger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 38px;
  padding: 7px 10px;
  border: 1px solid #d5d5d5;
  border-radius: 6px;
  background: #fff;
  color: #222;
  font: 800 12px "Orbitron", Arial, sans-serif;
  letter-spacing: .5px;
  cursor: pointer;
  transition: background .18s ease, border-color .18s ease;
}
.language-trigger:hover { background: #ededed; }
.language-trigger .flag-icon,
.language-option .flag-icon {
  display: block;
  width: 25px;
  height: 17px;
  flex: 0 0 auto;
  border-radius: 1px;
  overflow: hidden;
}
.language-trigger .chevron {
  width: 10px;
  height: 10px;
  fill: currentColor;
  transition: transform .18s ease;
}
.language-picker.open .chevron { transform: rotate(180deg); }
.language-menu {
  display: none;
  position: absolute;
  top: calc(100% + 7px);
  right: 0;
  min-width: 118px;
  padding: 5px;
  border: 1px solid #3c414c;
  border-radius: 6px;
  background: #252b37;
  box-shadow: 0 8px 22px rgba(0,0,0,.22);
}
.language-picker.open .language-menu { display: block; }
.language-option {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 8px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: #fff;
  text-align: left;
  font: 800 12px "Orbitron", Arial, sans-serif;
  letter-spacing: .4px;
  cursor: pointer;
}
.language-option:hover,
.language-option[aria-selected="true"] { background: #414958; }
.language-option[aria-selected="true"]::after {
  content: "✓";
  margin-left: auto;
  color: #c7b4ff;
}
body.dark-mode .language-trigger {
  background: #191919;
  color: #eee;
  border-color: #444;
}
body.dark-mode .language-trigger:hover { background: #292929; }
@media (max-width: 900px) {
  .language-picker { order: 4; }
}
@media (max-width: 600px) {
  .language-trigger { min-height: 36px; padding: 6px 9px; }
  .language-menu { right: auto; left: 0; }
}


/* Submit a Record */
.submit-area { max-width:1260px; margin:0 auto; padding:0 20px; }
.header-actions { margin-left:auto; display:flex; align-items:center; gap:10px; flex:0 0 auto; }

.submit-toggle,.submit-button {
  border:1px solid #a91f1f; border-radius:7px; background:linear-gradient(135deg,#e13a3a,#a91f1f); color:#fff; padding:12px 16px;
  font:800 12px "Orbitron",Arial,sans-serif; letter-spacing:.45px; cursor:pointer;

  transition:background .2s ease,transform .2s ease,box-shadow .2s ease;

.submit-toggle:hover,.submit-button:hover { background:linear-gradient(135deg,#ef4a4a,#b51f1f); transform:translateY(-2px); box-shadow:0 6px 15px rgba(198,40,40,.3); }
.submit-panel { margin:0; padding:0 24px; background:#fff; color:#171717; border:1px solid #ddd; border-radius:10px; box-shadow:0 3px 12px rgba(0,0,0,.07); opacity:0; transform:translateY(-12px) scale(.985); transform-origin:top center; max-height:0; overflow:hidden; transition:max-height .42s cubic-bezier(.2,.75,.25,1),opacity .28s ease,transform .35s cubic-bezier(.2,.75,.25,1),padding .3s ease,margin .3s ease; }
.submit-panel[hidden] { display:none; }
.submit-panel.is-open { opacity:1; transform:translateY(0) scale(1); max-height:2400px; margin:12px 0 18px; padding:24px; }
.device-select-wrap select { min-height:48px; border:1px solid #d4b0b0; border-radius:7px; background:linear-gradient(180deg,#fff,#f6eeee); color:#292020; font:800 13px "Orbitron",Arial,sans-serif; letter-spacing:.35px; cursor:pointer; box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 6px rgba(198,40,40,.06); transition:border-color .2s ease,box-shadow .2s ease,background .2s ease; }
.device-select-wrap select:hover,.device-select-wrap select:focus { border-color:#c62828; box-shadow:0 0 0 3px rgba(198,40,40,.11),0 3px 10px rgba(198,40,40,.08); }
.submit-panel h2 { margin:0 0 20px; font:800 22px "Orbitron",Arial,sans-serif; }
.submit-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }

.submit-field label,.submit-field span { line-height:1.35; }

.submit-field input,.submit-field select,.submit-field textarea,.level-select-trigger,.level-select-menu input {
  width:100%; min-width:0; border:1px solid #d4d4d4; border-radius:6px; background:#f7f7f7;
  color:#171717; padding:12px 13px; font:14px Arial,sans-serif; outline:none;
}
.submit-field textarea { resize:vertical; }
.submit-field input:focus,.submit-field select:focus,.submit-field textarea:focus,.level-select-trigger:focus { border-color:#c62828; box-shadow:0 0 0 2px rgba(198,40,40,.12); }
.select-wrap,.level-select-wrap { position:relative; }
.select-wrap select { appearance:none; padding-right:42px; }
.field-chevron { position:absolute; right:14px; top:50%; transform:translateY(-50%); color:#c62828; pointer-events:none; font-size:19px; line-height:1; }
.level-select-trigger { display:flex; align-items:center; justify-content:space-between; text-align:left; padding-right:42px; cursor:pointer; }
.level-select-trigger .field-chevron { right:14px; }
.level-select-menu { position:absolute; z-index:300; top:calc(100% + 6px); left:0; right:0; padding:8px; background:#fff; border:1px solid #ccc; border-radius:8px; box-shadow:0 10px 28px rgba(0,0,0,.18); }

.level-option:hover,.level-option[aria-selected="true"] { background:rgba(198,40,40,.1); }

  <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.1A8.8 8.8 0 0 1 8.9 3.8 9.2 9.2 0 1 0 20.2 15.1Z"/></svg>

    <span id="currentLanguageFlag" aria-hidden="true"></span>

<div class="search-container">

<input
type="text"

placeholder="Search levels..."
>

</div>

<div class="view-switch" role="group" aria-label="Choose leaderboard">
  <button class="view-button active" id="mainViewButton" data-view="main" type="button">MAIN LIST</button>
  <button class="view-button" id="upcomingViewButton" data-view="upcoming" type="button">UP AND COMING</button>
</div>



<section class="submit-area" aria-labelledby="submitHeading">
  <div class="submit-panel" id="submitPanel" hidden>
    <h2 id="submitHeading">Submit a Record</h2>
    <form id="recordForm" novalidate>
      <div class="submit-grid">
        <label class="submit-field submit-field-wide">
          <span>Level <b>*</b></span>
          <div class="level-select-wrap">
            <button type="button" class="level-select-trigger" id="levelSelectTrigger" aria-expanded="false">
              <span id="selectedLevelLabel">Select a level</span><span class="field-chevron" aria-hidden="true">⌄</span>
            </button>
            <div class="level-select-menu" id="levelSelectMenu" hidden>
              <input type="search" id="levelSelectSearch" placeholder="Search levels..." aria-label="Search levels">
              <div class="level-select-options" id="levelSelectOptions"></div>
            </div>
            <input type="hidden" id="selectedLevel" name="level" required>
          </div>
          <small class="field-error" data-error="level"></small>
        </label>
        <label class="submit-field">
          <span>Holder Name <b>*</b></span>
          <input type="text" id="holderName" name="holderName" maxlength="24" placeholder="Your display name" required>
          <small class="field-error" data-error="holderName"></small>
        </label>
        <label class="submit-field">
          <span>Completion Link <b>*</b></span>
          <input type="url" id="completionLink" name="completionLink" placeholder="https://..." required>
          <small class="field-error" data-error="completionLink"></small>
        </label>
        <label class="submit-field">
          <span>Device <b>*</b></span>
          <div class="select-wrap device-select-wrap">
            <select id="device" name="device" required aria-label="Pick device">
              <option value="">Select a device</option>
              <option value="PC">PC</option>
              <option value="Mobile">Mobile</option>
            </select>
            <span class="field-chevron" aria-hidden="true">⌄</span>
          </div>
          <small class="field-error" data-error="device"></small>
        </label>
        <label class="submit-field">
          <span>Custom ID <b>*</b></span>
          <input type="text" id="customId" name="customId" placeholder="ID of the level copy used" required>
          <small class="field-error" data-error="customId"></small>
        </label>
        <label class="submit-field">
          <span>Raw Footage <b>*</b></span>
          <input type="url" id="rawFootage" name="rawFootage" placeholder="Link to your raw footage" required>
          <small class="field-error" data-error="rawFootage"></small>
        </label>
      </div>
      <label class="submit-field notes-field">
        <span>Additional Notes</span>
        <textarea id="additionalNotes" name="additionalNotes" rows="3" placeholder="Anything you'd like the staff to know..."></textarea>
      </label>
      <p class="submit-guidelines">By submitting this record, you acknowledge that it follows the <a href="#" id="guidelinesLink">submission guidelines</a>.</p>
      <p class="submit-status" id="submitStatus" role="status" aria-live="polite"></p>
      <button type="submit" class="submit-button">Submit Record</button>
    </form>
  </div>
</section>

let currentLanguage = "en";
const tr = key => translations[currentLanguage][key] || translations.en[key] || key;

function updateLanguageInterface() {
  document.documentElement.lang = currentLanguage;
  document.querySelector(".subtitle").textContent = tr("subtitle");
  document.getElementById("mainViewButton").textContent = tr("mainList");
  document.getElementById("upcomingViewButton").textContent = tr("upcomingButton");
  document.querySelector("footer").textContent = tr("footer");
  document.getElementById("search").placeholder =
    currentView === "upcoming" ? tr("searchUpcoming") : tr("searchMain");

  const codes = { en: "ENG", ru: "RUS", es: "ESP", fr: "FRE" };
  document.getElementById("currentLanguageCode").textContent = codes[currentLanguage];
  document.getElementById("currentLanguageFlag").innerHTML = languageFlags[currentLanguage];
  document.getElementById("languageTrigger").setAttribute("aria-label", tr("chooseLanguage"));

  document.querySelectorAll(".language-option").forEach(option => {
    const selected = option.dataset.language === currentLanguage;
    option.setAttribute("aria-selected", String(selected));
    option.querySelector(".flag-icon").outerHTML = languageFlags[option.dataset.language];
  });

  const dark = document.body.classList.contains("dark-mode");
  const themeToggle = document.getElementById("themeToggle");
  themeToggle.setAttribute("aria-label", dark ? tr("switchLight") : tr("switchDark"));
  themeToggle.title = dark ? tr("switchLight") : tr("switchDark");

  const isUpcoming = currentView === "upcoming";
  document.querySelector(".list-title").textContent =
    isUpcoming ? tr("upcomingTitle") : tr("mainTitle");

  displayLevels(
    isUpcoming ? sortedUpcomingLevels() : levels,
    currentView
  );
}

(() => {
  const picker = document.getElementById("languagePicker");
  const trigger = document.getElementById("languageTrigger");
  const closePicker = () => {
    picker.classList.remove("open");
    trigger.setAttribute("aria-expanded", "false");
  };

  trigger.addEventListener("click", () => {
    const opening = !picker.classList.contains("open");
    picker.classList.toggle("open", opening);
    trigger.setAttribute("aria-expanded", String(opening));
  });

  picker.querySelectorAll(".language-option").forEach(option => {
    option.addEventListener("click", () => {
      currentLanguage = option.dataset.language;
      closePicker();
      updateLanguageInterface();
    });
  });

  document.addEventListener("click", event => {
    if (!picker.contains(event.target)) closePicker();
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape") closePicker();
  });
})();

function createLevelCard(level, index, isUpcoming = false) {

const rank = index + 1;

let glowClass = "";

if (rank === 1 && !level.blank) {
glowClass = "gold-glow";
}

if (rank >= 4 && rank <= 10) {
glowClass = "white-glow";
}

const firstVictor =
firstVictors[rank] || tr("notAdded");

const displayValue = value =>
(!value || String(value).trim().toLowerCase() === "not added") ? tr("notAdded") : value;

const objects =
(!level.objects || String(level.objects).trim().toLowerCase() === "not added") ? tr("notAdded") : level.objects;


return `

<div class="level-card ${glowClass} ${isUpcoming ? "upcoming-card" : ""} ${level.blank ? "blank-level" : ""}">

<div class="left-side">

<div class="rank">
#${rank}
</div>


<div
class="thumbnail ${level.image ? "" : "blank-thumbnail"}"
style="${level.image ? `background-image: url('${level.image}');` : ''}"
onclick="${level.image ? `openModal('${level.image}')` : ''}"
aria-label="${level.name || tr('blankSlot')}"
></div>


<div class="level-details">

<div class="level-name">
${level.blank ? "" : level.name}
</div>


<div class="detail-line">
${level.blank ? "" : `<strong>${tr("hostedBy")}</strong> ${displayValue(level.host)}`}
</div>


<div class="detail-line">
${level.blank ? "" : `<strong>${isUpcoming ? tr("currentVerifier") : tr("verifiedBy")}</strong> ${displayValue(level.verifier)}`}
</div>


<div class="detail-line">
${level.blank ? "" : (isUpcoming ? `<strong>${tr("bestProgress")}</strong> <span class="progress-value">${level.progress === null || level.progress === undefined || level.progress === "" ? tr("notAdded") : level.progress}</span>` : `<strong>${tr("firstVictor")}</strong> ${firstVictor}`)}
</div>

</div>



</div>


${isUpcoming ? "" : `<div class="divider"></div>

<div class="right-side">

<div class="right-title">
${tr("levelInfo")}
</div>

<div class="right-info">
<strong>${tr("levelId")}</strong>
${displayValue(level.id)}
</div>

<div class="right-info">
<strong>${tr("length")}</strong>
${displayValue(level.length)}
</div>

<div class="right-info">
<strong>${tr("objects")}</strong>
${objects}
</div>

<a href="${level.verification}" target="_blank" class="verification-button">
<span class="play-icon" aria-hidden="true"></span>
<span class="verification-label">${tr("verificationVideo")}</span>
</a>

</div>`}

</div>

`;

}


function progressAmount(progress) {
  // A run such as 4-100 represents 96 percentage points of progress.
  // Keep the original range text for display; use only the calculated amount to rank.
  const values = String(progress ?? "").match(/\d+(?:\.\d+)?/g);
  if (!values || !values.length) return -1;
  const numbers = values.map(Number);
  return numbers.length >= 2 ? numbers[numbers.length - 1] - numbers[0] : numbers[0];
}

function sortedUpcomingLevels() {
  // Stable sorting keeps the existing order when two levels have equal progress.
  return upcomingLevels
    .map((level, originalIndex) => ({ level, originalIndex }))
    .sort((a, b) => {
      if (a.level.blank) return b.level.blank ? a.originalIndex - b.originalIndex : 1;
      if (b.level.blank) return -1;
      return progressAmount(b.level.progress) - progressAmount(a.level.progress) || a.originalIndex - b.originalIndex;
    })
    .map(entry => entry.level);
}

let currentView = "main";

function displayLevels(levelArray, view = currentView) {
  const list = document.getElementById("level-list");
  list.innerHTML = "";
  levelArray.forEach((level, index) => {
    const originalIndex = view === "main" ? levels.indexOf(level) : index;
    list.innerHTML += createLevelCard(level, originalIndex >= 0 ? originalIndex : index, view === "upcoming");
  });
}

function switchView(view) {
  currentView = view;
  const isUpcoming = view === "upcoming";
  const title = document.querySelector(".list-title");
  const search = document.getElementById("search");
  title.textContent = isUpcoming ? tr("upcomingTitle") : tr("mainTitle");
  const logoAccent = document.querySelector(".logo span");
  logoAccent.classList.toggle("purple", isUpcoming);
  logoAccent.classList.toggle("red", !isUpcoming);
  search.placeholder = isUpcoming ? tr("searchUpcoming") : tr("searchMain");
  document.getElementById("mainViewButton").classList.toggle("active", !isUpcoming);
  document.getElementById("upcomingViewButton").classList.toggle("active", isUpcoming);
  document.getElementById("mainViewButton").setAttribute("aria-pressed", String(!isUpcoming));
  document.getElementById("upcomingViewButton").setAttribute("aria-pressed", String(isUpcoming));
  search.value = "";
  displayLevels(isUpcoming ? sortedUpcomingLevels() : levels, view);
}

document.getElementById("mainViewButton").addEventListener("click", () => switchView("main"));
document.getElementById("upcomingViewButton").addEventListener("click", () => switchView("upcoming"));


document
.getElementById("search")
.addEventListener(
"input",
function() {

const searchTerm =
this.value.toLowerCase();


const sourceLevels = currentView === "upcoming" ? sortedUpcomingLevels() : levels;
const filteredLevels = sourceLevels.filter(level =>
  (level.name || "").toLowerCase().includes(searchTerm)
);

displayLevels(filteredLevels, currentView);

}
);

// Submit form: level choices are sourced exclusively from the 75 Main List entries.
(() => {
  const panel = document.getElementById("submitPanel");
  const toggle = document.getElementById("openSubmitForm");
  const trigger = document.getElementById("levelSelectTrigger");
  const menu = document.getElementById("levelSelectMenu");
  const options = document.getElementById("levelSelectOptions");
  const search = document.getElementById("levelSelectSearch");
  const selected = document.getElementById("selectedLevel");
  const selectedLabel = document.getElementById("selectedLevelLabel");
  const form = document.getElementById("recordForm");
  const status = document.getElementById("submitStatus");
  const nameInput = document.getElementById("holderName");
  const deviceSelect = document.getElementById("device");
  deviceSelect.addEventListener("change",() => clearError("device"));

  // Animate the panel without changing its form contents or validation behavior.
  toggle.addEventListener("click", () => {
    const opening = panel.hidden;
    if (opening) {
      panel.hidden = false;
      toggle.setAttribute("aria-expanded","true");
      toggle.textContent = "CLOSE FORM";
      requestAnimationFrame(() => {
        panel.classList.add("is-open");
        panel.scrollIntoView({behavior:"smooth",block:"nearest"});
      });
    } else {
      panel.classList.remove("is-open");
      toggle.setAttribute("aria-expanded","false");
      toggle.textContent = "SUBMIT A RECORD";
      const finishClose = event => {
        if (event.target !== panel || event.propertyName !== "max-height") return;
        panel.hidden = true;
        panel.removeEventListener("transitionend",finishClose);
      };
      panel.addEventListener("transitionend",finishClose);
      // Fallback for reduced-motion or interrupted transitions.
      setTimeout(() => { if (!panel.classList.contains("is-open")) panel.hidden = true; },450);
    }
  });

  // Basic client-side screening only. Production submissions must repeat moderation server-side.
  const blockedTerms = ["nigger","faggot","retard","kys"];
  const normalize = value => value.toLowerCase().replace(/[^a-z0-9]/g,"");
  const imageUrl = value => {
    if (!value || value === "#") return "";
    if (/^(https?:|data:)/i.test(value)) return value;
    return value;
  };

  function renderOptions(query = "") {
    const q = query.trim().toLowerCase();
    options.innerHTML = "";
    levels.forEach(level => {
      if (!level.name.toLowerCase().includes(q)) return;
      const button = document.createElement("button");
      button.type = "button";
      button.className = "level-option";
      button.setAttribute("role","option");
      button.setAttribute("aria-selected",String(selected.value === level.name));
      const img = document.createElement("img");
      img.alt = "";
      img.loading = "lazy";
      img.src = imageUrl(level.image);
      img.onerror = () => { img.style.visibility = "hidden"; };
      const name = document.createElement("span");
      name.textContent = level.name;
      button.append(img,name);
      button.addEventListener("click", () => {
        selected.value = level.name;
        selectedLabel.textContent = level.name;
        menu.hidden = true;
        trigger.setAttribute("aria-expanded","false");
        clearError("level");
        renderOptions(search.value);
      });
      options.appendChild(button);
    });
  }
  renderOptions();

  // Keep one click handler only: the animated handler above controls opening and closing.
  trigger.addEventListener("click", () => {
    menu.hidden = !menu.hidden;
    trigger.setAttribute("aria-expanded",String(!menu.hidden));
    if (!menu.hidden) { search.value = ""; renderOptions(); search.focus(); }
  });
  search.addEventListener("input", () => renderOptions(search.value));
  document.addEventListener("click", event => {
    if (!event.target.closest(".level-select-wrap")) {
      menu.hidden = true;
      trigger.setAttribute("aria-expanded","false");
    }
  });

  function clearError(key) {
    const field = document.querySelector(`[data-error="${key}"]`);
    if (field) field.textContent = "";
    const control = key === "level" ? trigger : document.getElementById(key);
    if (control) control.closest(".submit-field")?.classList.remove("invalid");
  }
  function setError(key, message) {
    const field = document.querySelector(`[data-error="${key}"]`);
    if (field) field.textContent = message;
    const control = key === "level" ? trigger : document.getElementById(key);
    control?.closest(".submit-field")?.classList.add("invalid");
  }

  nameInput.addEventListener("input", () => {
    const normalized = normalize(nameInput.value);
    if (blockedTerms.some(term => normalized.includes(normalize(term)))) {
      setError("holderName","This name is not allowed.");
    } else clearError("holderName");
  });

  form.addEventListener("submit", event => {
    event.preventDefault();
    status.textContent = "";
    ["level","holderName","completionLink","device","customId","rawFootage"].forEach(clearError);
    let valid = true;
    const required = [
      ["level",selected.value,"Please select a Main List level."],
      ["holderName",nameInput.value.trim(),"Please enter a Holder Name."],
      ["completionLink",document.getElementById("completionLink").value.trim(),"Please enter a completion video link."],
      ["device",document.getElementById("device").value,"Please select PC or Mobile."],
      ["customId",document.getElementById("customId").value.trim(),"Please enter the Custom ID."],
      ["rawFootage",document.getElementById("rawFootage").value.trim(),"Please enter a Raw Footage link."]
    ];
    required.forEach(([key,value,message]) => {
      if (!value) { setError(key,message); valid = false; }
    });
    const normalized = normalize(nameInput.value);
    if (normalized && blockedTerms.some(term => normalized.includes(normalize(term)))) {
      setError("holderName","This name is not allowed."); valid = false;
    }
    ["completionLink","rawFootage"].forEach(key => {
      const input = document.getElementById(key);
      if (input.value.trim() && !/^https?:\/\//i.test(input.value.trim())) {
        setError(key,"Please enter a valid http:// or https:// link."); valid = false;
      }
    });
    if (!valid) {
      status.textContent = "Please fix the highlighted fields before submitting.";
      return;
    }

    // Front-end demo only: no server or moderator inbox is connected in this HTML file.
    status.textContent = "Your form is valid! Submission storage and staff review need to be connected to a backend.";
  });
})();


displayLevels(levels, "main");
updateLanguageInterface();

// Hide the sticky header while scrolling down; reveal it when scrolling up.
(() => {
const siteHeader = document.querySelector("header");
if (!siteHeader) return;
let lastScrollY = window.scrollY;
let ticking = false;
const updateHeader = () => {
const currentY = window.scrollY;
if (currentY <= 10 || currentY < lastScrollY) {
siteHeader.classList.remove("header-hidden");
} else if (currentY > lastScrollY) {
siteHeader.classList.add("header-hidden");
}
lastScrollY = currentY;
ticking = false;
};
window.addEventListener("scroll", () => {
if (!ticking) {
window.requestAnimationFrame(updateHeader);
ticking = true;
}
}, { passive: true });
})();


// Black crescent switches to a white sun and enables the site-wide dark theme.
(() => {
  const toggle = document.getElementById('themeToggle');
  if (!toggle) return;
  const setDarkMode = (enabled) => {
    document.body.classList.toggle('dark-mode', enabled);
    toggle.setAttribute('aria-pressed', String(enabled));
    toggle.setAttribute('aria-label', enabled ? tr('switchLight') : tr('switchDark'));
    toggle.title = enabled ? tr('switchLight') : tr('switchDark');
  };
  toggle.addEventListener('click', () => setDarkMode(!document.body.classList.contains('dark-mode')));
})();
</script>
