<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DemonVerse</title>

<link rel="icon" type="image/png" href="general-profile-picture-1024x1024.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:ital,wght@1,800;1,900&display=swap');

* {
box-sizing: border-box;
}
button, input, select, textarea { font: inherit; }


body {
margin: 0;
font-family: Inter, Arial, Helvetica, sans-serif;
background: #f5f5f5;
color: #111;
}

header {
position: sticky;
top: 0;
z-index: 100;
transition: none;
background: white;
border-bottom: 1px solid #ddd;
padding: 18px 30px;
display: flex;
align-items: center;
gap: 25px;
}

.logo {
cursor: pointer;
font-size: 28px;
font-weight: 800;
white-space: nowrap;
}

.logo .red {
color: var(--accent-logo);
}

.subtitle {
font-size: 13px;
font-weight: 500;
color: #777;
letter-spacing: 0.5px;
white-space: nowrap;
}

.discord-button {
margin-left: auto;
background: #5865f2;
color: white;
text-decoration: none;
padding: 13px 22px;
border-radius: 6px;
font-family: Inter, Arial, Helvetica, sans-serif;
font-size: 15px;
font-weight: 800;
letter-spacing: 0.8px;
white-space: nowrap;
display: flex;
align-items: center;
box-shadow:
0 0 5px rgba(255, 255, 255, 0.18);
transition:
background 0.2s ease,
box-shadow 0.2s ease;
}

.discord-button img {
width: 18px;
height: 18px;
object-fit: contain;
}

.discord-button:hover {
background: #4752c4;
box-shadow:
0 0 7px rgba(255, 255, 255, 0.28);
}

.search-container {
max-width: 1200px;
margin: 25px auto 0;
padding: 0 20px;
}

#search {
width: 100%;
padding: 13px 15px;
border: 1px solid #ccc;
border-radius: 7px;
font-size: 15px;
outline: none;
background: white;
color: #111;
color-scheme: light;
-webkit-appearance: none;
appearance: none;
}

#search::placeholder {
color: #777;
opacity: 1;
}

#search:focus {
border-color: #999;
}

.list-container {
max-width: 1260px;
margin: 20px auto 50px;
padding: 0 20px;
}

.list-title {
font-size: 22px;
font-weight: 700;
margin-bottom: 18px;
}

.level-card {
position: relative;
display: flex;
width: 100%;
background: white;
border: 1px solid #ddd;
border-radius: 8px;
overflow: hidden;
box-shadow: 0 2px 5px rgba(0,0,0,0.08);
margin-bottom: 18px;
min-height: 215px;
}

/* Hover: each level card grows slightly. 1.015 is small enough to stay inside the 18px gap between cards. */
.level-card {
transition: transform .2s ease;
}
@media (hover: hover) {
.level-card:hover {
transform: scale(1.015);
position: relative;
z-index: 1;
}
}
@media (prefers-reduced-motion: reduce) {
.level-card { transition: none; }
}

.left-side {
flex: 1;
min-width: 0;
padding: 8px 28px;
display: flex;
align-items: center;
gap: 20px;
}

.rank {
font-size: 18px;
font-weight: 700;
min-width: 35px;
text-align: center;
}

/* THUMBNAILS — FULL IMAGE, NO CROPPING/ZOOMING */

.thumbnail {
width: 300px;
height: 175px;
border-radius: 6px;
cursor: pointer;
flex-shrink: 0;
background-size: contain !important;
background-repeat: no-repeat;
background-position: center;
background-color: #eee;
}

.blank-thumbnail {
background: #f5f5f5;
border: 1px dashed #ccc;
cursor: default;
}

.level-details {
display: flex;
flex-direction: column;
gap: 12px;
}

.level-name {
font-size: 28px;
font-weight: 700;
margin-bottom: 2px;
}

.detail-line {
font-size: 16px;
font-weight: 500;
}

.detail-line strong {
font-weight: 600;
}

.divider {
width: 1px;
background: #ddd;
margin: 20px 0;
}

.right-side {
width: 260px;
flex-shrink: 0;
padding: 25px 20px 25px 10px;
display: flex;
flex-direction: column;
justify-content: center;
align-items: flex-start;
text-align: left;
margin-left: auto;
}

.right-title {
color: var(--accent-text);
font-size: 16px;
font-weight: 600;
margin-bottom: 16px;
}

.right-info {
font-size: 15px;
font-weight: 500;
margin-bottom: 12px;
}

.right-info strong {
font-weight: 600;
}

.verification-button {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 9px;
margin-top: 5px;
padding: 12px 20px;
background: var(--accent);
color: var(--on-accent);
text-decoration: none;
border-radius: 6px;
font-size: 15px;
font-weight: 600;
white-space: nowrap;
}

.verification-button .play-icon {
display: inline-block;
flex: 0 0 auto;
width: 0;
height: 0;
border-top: 6px solid transparent;
border-bottom: 6px solid transparent;
border-left: 9px solid var(--on-accent);
}

.verification-button:hover {
background: var(--accent-hover);
}

.gold-glow {
box-shadow:
0 0 8px rgba(255, 196, 0, 0.55),
0 0 18px rgba(255, 196, 0, 0.35);
}

.white-glow {
box-shadow:
0 0 7px rgba(150, 150, 150, 0.45),
0 0 15px rgba(190, 190, 190, 0.25);
}

.blank-level .level-details,
.blank-level .right-side {
visibility: hidden;
}

footer {
text-align: center;
padding: 30px;
color: #888;
font-size: 13px;
}

.image-modal {
display: none;
position: fixed;
z-index: 1000;
inset: 0;
background: rgba(0,0,0,0.85);
align-items: center;
justify-content: center;
padding: 30px;
}

.image-modal img {
width: min(90vw, 1200px);
height: min(82vh, 760px);
max-width: 100%;
max-height: 100%;
object-fit: contain;
border-radius: 8px;
background: rgba(0, 0, 0, 0.15);
}

.image-modal .close {
position: absolute;
top: 20px;
right: 30px;
color: white;
font-size: 40px;
cursor: pointer;
font-weight: 300;
}

.theme-toggle {
width: 38px;
height: 38px;
flex: 0 0 38px;
display: inline-flex;
align-items: center;
justify-content: center;
padding: 0;
border: 1px solid #d5d5d5;
border-radius: 50%;
background: #f4f4f4;
cursor: pointer;
transition: background .2s ease, border-color .2s ease, transform .2s ease;
}
.theme-toggle:hover { transform: rotate(-8deg) scale(1.05); }
.theme-toggle svg { width: 22px; height: 22px; display: block; }
.theme-toggle .moon-icon { display: block; fill: #000; }
.theme-toggle .sun-icon { display: none; fill: #fff; }

body.dark-mode {
background: #101010;
color: #f3f3f3;
color-scheme: dark;
}
body.dark-mode header { background: #171717; border-bottom-color: #333; }
body.dark-mode .subtitle { color: #aaa; }
body.dark-mode .theme-toggle { background: #090909; border-color: #555; }
body.dark-mode .theme-toggle .moon-icon { display: none; }
body.dark-mode .theme-toggle .sun-icon { display: block; }
body.dark-mode #search { background: #1d1d1d; color: #f5f5f5; border-color: #444; color-scheme: dark; }
body.dark-mode #search::placeholder { color: #aaa; }
body.dark-mode .level-card { background: #191919; border-color: #383838; box-shadow: 0 2px 8px rgba(0,0,0,.28); }
/* Keep the #1 gold glow visible in dark mode too. */
body.dark-mode .level-card.gold-glow {
box-shadow:
0 0 8px rgba(255, 196, 0, 0.65),
0 0 18px rgba(255, 196, 0, 0.45),
0 0 30px rgba(255, 196, 0, 0.22);
}
body.dark-mode .thumbnail { background-color: #252525; }
body.dark-mode .blank-thumbnail { background: #202020; border-color: #555; }
body.dark-mode .divider { background: #393939; }
.extended-divider { height:1px; background:#ddd; margin:30px 0 24px; }
.extended-divider[hidden] { display:none; }
body.dark-mode .extended-divider { background:#393939; }
body.dark-mode footer { color: #999; }

@media (max-width: 900px) {

header {
flex-wrap: wrap;
gap: 12px;
}

.subtitle {
width: 100%;
order: 3;
}

.discord-button {
margin-left: auto;
}

.left-side {
width: 100%;
flex-wrap: wrap;
padding: 18px;
}

.divider {
width: calc(100% - 36px);
height: 1px;
margin: 0 18px;
}

.right-side {
width: 100%;
padding: 20px 18px 25px;
margin-left: 0;
align-items: flex-start;
text-align: left;
}

.level-card {
flex-wrap: wrap;
}

.thumbnail {
width: 250px;
height: 145px;
}
}

@media (max-width: 600px) {
.level-name {
font-size: 23px;
}

.thumbnail {
display: block;
width: 100%;
height: auto;
aspect-ratio: 16 / 9;
min-height: 120px;
max-height: 220px;
background-size: contain !important;
background-repeat: no-repeat;
background-position: center;
}

.verification-button {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 9px;
min-height: 42px;
padding: 10px 16px;
max-width: 100%;
white-space: nowrap;
}

.verification-button .play-icon {
display: inline-block;
}

.verification-button .verification-label {
display: inline;
}

.left-side {
align-items: flex-start;
}

.rank {
min-width: 30px;
}
}

/* ===== Website colour (chosen in the gear menu). Red is the default. =====
   --accent = button colour, --accent-hover = button hover, --on-accent = text on buttons,
   --accent-text / --accent-text-2 = coloured text, --accent-logo = the "Verse" part of the logo. */
:root {
--accent: #d22b2b;
--accent-hover: #b92323;
--on-accent: #fff;
--accent-text: #d22b2b;
--accent-text-2: #d22b2b;
--accent-logo: #d62828;
}
body.dark-mode { --accent-text-2: #ff6b6b; }
body[data-accent="pink"] { --accent:#ec4899; --accent-hover:#db2777; --on-accent:#fff; --accent-text:#db2777; --accent-text-2:#db2777; --accent-logo:#db2777; }
body.dark-mode[data-accent="pink"] { --accent-text:#f472b6; --accent-text-2:#f472b6; --accent-logo:#ec4899; }
body[data-accent="purple"] { --accent:#7c3aed; --accent-hover:#6d28d9; --on-accent:#fff; --accent-text:#7c3aed; --accent-text-2:#7c3aed; --accent-logo:#7c3aed; }
body.dark-mode[data-accent="purple"] { --accent-text:#a78bfa; --accent-text-2:#a78bfa; --accent-logo:#8b5cf6; }
body[data-accent="blue"] { --accent:#2563eb; --accent-hover:#1d4ed8; --on-accent:#fff; --accent-text:#2563eb; --accent-text-2:#2563eb; --accent-logo:#2563eb; }
body.dark-mode[data-accent="blue"] { --accent-text:#60a5fa; --accent-text-2:#60a5fa; --accent-logo:#3b82f6; }
body[data-accent="green"] { --accent:#16a34a; --accent-hover:#15803d; --on-accent:#fff; --accent-text:#15803d; --accent-text-2:#15803d; --accent-logo:#16a34a; }
body.dark-mode[data-accent="green"] { --accent-text:#4ade80; --accent-text-2:#4ade80; --accent-logo:#22c55e; }
body[data-accent="orange"] { --accent:#f97316; --accent-hover:#ea580c; --on-accent:#fff; --accent-text:#ea580c; --accent-text-2:#ea580c; --accent-logo:#ea580c; }
body.dark-mode[data-accent="orange"] { --accent-text:#fb923c; --accent-text-2:#fb923c; --accent-logo:#f97316; }
body[data-accent="yellow"] { --accent:#facc15; --accent-hover:#eab308; --on-accent:#111; --accent-text:#a16207; --accent-text-2:#a16207; --accent-logo:#ca8a04; }
body.dark-mode[data-accent="yellow"] { --accent-text:#fde047; --accent-text-2:#fde047; --accent-logo:#facc15; }
body[data-accent="white"] { --accent:#222; --accent-hover:#000; --on-accent:#fff; --accent-text:#222; --accent-text-2:#222; --accent-logo:#222; }
body.dark-mode[data-accent="white"] { --accent:#fff; --accent-hover:#d9d9d9; --on-accent:#111; --accent-text:#fff; --accent-text-2:#fff; --accent-logo:#fff; }

/* Settings (gear) button + menu */
.settings-picker { position:relative; flex:0 0 auto; z-index:150; margin-left:-15px; } /* sits closer to the light/dark button (normal gap is 25px, now 10px) */
@media (max-width: 900px) { .settings-picker { margin-left:-6px; } } /* phones: gap 12px -> 6px */
.settings-toggle svg { fill:#000; }
body.dark-mode .settings-toggle svg { fill:#fff; }
.settings-menu {
position:absolute; top:calc(100% + 8px); left:0; width:250px; max-width:calc(100vw - 40px);
padding:14px 16px; background:#fff; color:#222; border:1px solid #ddd; border-radius:8px;
box-shadow:0 8px 22px rgba(0,0,0,.18);
}
.settings-menu[hidden] { display:none; }
.settings-section { margin-top:16px; }
.color-row { display:flex; flex-wrap:wrap; gap:8px; padding:2px; }
.color-swatch { width:22px; height:22px; padding:0; border:0; border-radius:50%; background:var(--sw); color:inherit; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.3); }
body.dark-mode .color-swatch { box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); }
.color-swatch[aria-checked="true"] { outline:2px solid currentColor; outline-offset:2px; }
.settings-label { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; font-size:13px; font-weight:700; }
.settings-label #volumeValue { font-family:Inter,Arial,sans-serif; font-size:12px; color:var(--accent-text-2); }
/* Volume slider: thin bar with a small red circle that is a bit bigger than the bar. */
#volumeSlider { -webkit-appearance:none; appearance:none; width:100%; height:18px; margin:0; background:transparent; cursor:pointer; outline:none; }
#volumeSlider::-webkit-slider-runnable-track { height:6px; border-radius:3px; background:#d5d5d5; }
#volumeSlider::-moz-range-track { height:6px; border-radius:3px; background:#d5d5d5; }
#volumeSlider::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:16px; height:16px; margin-top:-5px; border:0; border-radius:50%; background:var(--accent); }
#volumeSlider::-moz-range-thumb { width:16px; height:16px; border:0; border-radius:50%; background:var(--accent); }
#volumeSlider:focus-visible::-webkit-slider-thumb { box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
#volumeSlider:focus-visible::-moz-range-thumb { box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
body.dark-mode #volumeSlider::-webkit-slider-runnable-track { background:#444; }
body.dark-mode #volumeSlider::-moz-range-track { background:#444; }
body.dark-mode .settings-menu { background:#191919; color:#eee; border-color:#444; box-shadow:0 8px 22px rgba(0,0,0,.5); }

/* ===== Snow ===== */
#snowCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 60; pointer-events: none; }

/* ===== Custom vector badges, anchored inside the top-left of each level card ===== */
.level-badges { position:absolute; top:8px; left:8px; z-index:3; display:flex; flex-direction:column; align-items:flex-start; gap:4px; pointer-events:none; }
.lvl-badge { display:block; width:74px; aspect-ratio:4.52 / 1; filter:drop-shadow(0 1px 2px rgba(0,0,0,.38)); flex:none; }
.lvl-badge svg { display:block; width:100%; height:100%; }
.badge-winner { width:82px; }
@media (max-width: 900px) {
.level-badges { top:8px; left:8px; }
.level-card.has-badges .left-side { padding-top:42px; }
}
@media (max-width: 600px) {
.lvl-badge { width:66px; }
.badge-winner { width:74px; }
.level-card.has-badges .left-side { padding-top:38px; }
}

/* Language selector and flag icons */
.language-picker {
position: relative;
flex: 0 0 auto;
z-index: 150;
}
.language-trigger {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 8px;
min-height: 38px;
padding: 7px 10px;
border: 1px solid #d5d5d5;
border-radius: 6px;
background: #fff;
color: #222;
font: 800 12px Inter, Arial, sans-serif;
letter-spacing: .5px;
cursor: pointer;
transition: background .18s ease, border-color .18s ease;
}
.language-trigger:hover { background: #ededed; }
.language-trigger .flag-icon,
.language-option .flag-icon {
  display:block; width:24px; height:16px; flex:0 0 24px; object-fit:fill; border-radius:3px; overflow:hidden; box-shadow:0 0 0 1px rgba(127,127,127,.35);
}
.language-trigger .chevron {
width: 10px;
height: 10px;
fill: currentColor;
transition: transform .18s ease;
}
.language-picker.open .chevron { transform: rotate(180deg); }
.language-menu {
display: none;
position: absolute;
top: calc(100% + 7px);
right: 0;
min-width: 118px;
padding: 5px;
border: 1px solid #3c414c;
border-radius: 6px;
background: #252b37;
box-shadow: 0 8px 22px rgba(0,0,0,.22);
}
.language-picker.open .language-menu { display: block; }
.language-option {
width: 100%;
display: flex;
align-items: center;
gap: 9px;
padding: 9px 8px;
border: 0;
border-radius: 4px;
background: transparent;
color: #fff;
text-align: left;
font: 800 12px Inter, Arial, sans-serif;
letter-spacing: .4px;
cursor: pointer;
}
.language-option:hover,
.language-option[aria-selected="true"] { background: #414958; }
.language-option[aria-selected="true"]::after {
content: "✓";
margin-left: auto;
color: #c7b4ff;
}
body.dark-mode .language-trigger {
background: #191919;
color: #eee;
border-color: #444;
}
body.dark-mode .language-trigger:hover { background: #292929; }
@media (max-width: 900px) {
.language-picker { order: 4; }
}
@media (max-width: 600px) {
.language-trigger { min-height: 36px; padding: 6px 9px; }
.language-menu { right: auto; left: 0; }
}


/* Header buttons: FAQ + Discord share the same class, so padding/font/height match.
   The grid makes both buttons exactly the same width and height as well. */
.header-actions { margin-left:auto; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; align-items:stretch; gap:10px; flex:0 0 auto; }
.header-actions .discord-button { margin-left:0; justify-content:center; text-align:center; }
.faq-button { border:0; margin:0; cursor:pointer; background:var(--accent); color:var(--on-accent); }
.faq-button:hover { background:var(--accent-hover); }
@media(max-width:900px) {
.header-actions { order:5; margin-left:auto; }
.header-actions .discord-button { padding:10px 12px; font-size:11px; }
}
@media(max-width:600px) {
.header-actions { gap:7px; }
.header-actions .discord-button { padding:9px 10px; font-size:10px; letter-spacing:.2px; }
}

/* FAQ panel */
.faq-area { max-width:1260px; margin:0 auto; padding:0 20px; }
.faq-panel { margin:0; padding:0 24px; background:#fff; color:#171717; border:1px solid #ddd; border-radius:10px; box-shadow:0 3px 12px rgba(0,0,0,.07); opacity:0; transform:translateY(-12px) scale(.985); transform-origin:top center; max-height:0; overflow:hidden; transition:max-height .42s cubic-bezier(.2,.75,.25,1),opacity .28s ease,transform .35s cubic-bezier(.2,.75,.25,1),padding .3s ease,margin .3s ease; }
.faq-panel[hidden] { display:none; }
.faq-panel.is-open { opacity:1; transform:translateY(0) scale(1); max-height:6000px; margin:12px 0 18px; padding:24px; }
.faq-panel h2 { margin:0 0 20px; font:800 22px Inter,Arial,sans-serif; }
.faq-item { padding:16px 0; border-top:1px solid #e2e2e2; }
.faq-item:first-of-type { border-top:0; padding-top:0; }
.faq-question { margin:0 0 8px; font-size:17px; font-weight:700; color:var(--accent-text-2); }
.faq-answer { margin:0; font-size:15px; line-height:1.55; color:#333; overflow-wrap:anywhere; }
body.dark-mode .faq-panel { background:#191919; color:#f2f2f2; border-color:#383838; box-shadow:0 3px 12px rgba(0,0,0,.3); }
body.dark-mode .faq-item { border-top-color:#383838; }
body.dark-mode .faq-answer { color:#ddd; }
@media(max-width:600px) {
.faq-area { padding:0 14px; }
.faq-panel.is-open { padding:17px; }
.faq-panel h2 { font-size:19px; }
.faq-question { font-size:16px; }
}
@media(prefers-reduced-motion:reduce) {
.faq-panel { transition:none; }
}


/* ===== Infinite Demonlist-inspired DemonVerse redesign ===== */
:root { --accent:#d62828; --accent-hover:#b91f1f; --on-accent:#fff; --accent-text:#e34a4a; --accent-text-2:#ff6666; --accent-logo:#e04444; }
body, button, input { font-family: Inter, Arial, Helvetica, sans-serif; }
body { background:#0b0c10; color:#f4f5f7; }
header { position:sticky; top:0; z-index:1000; transform:none !important; min-height:60px; padding:0 clamp(14px,3vw,34px); gap:clamp(12px,2vw,26px); background:#131722; border-bottom:1px solid #292e39; display:flex; flex-wrap:nowrap; }
header.header-hidden { transform:none !important; }
.logo { font-family:Montserrat, Inter, Arial, sans-serif; font-size:23px; font-style:italic; font-weight:900; letter-spacing:-1.15px; }
.logo .red { color:#e04444; }
.subtitle { display:none; }
.header-socials { display:flex; align-items:center; gap:13px; }

/* Reliable light/dark themes for the redesigned layout. */
body { background:#0b0c10; color:#f4f5f7; transition:background .18s ease,color .18s ease; }
body.dark-mode { background:#0b0c10 !important; color:#f4f5f7 !important; color-scheme:dark; }
body:not(.dark-mode) { background:#f4f5f7 !important; color:#17191f !important; color-scheme:light; }
body:not(.dark-mode) header { background:#fff !important; border-bottom-color:#d9dce2 !important; }
body:not(.dark-mode) .level-card { background:#fff !important; border-color:#d9dce2 !important; }
body:not(.dark-mode) .level-card:hover { background:#f8f9fb !important; border-color:#c4c9d2 !important; }
body:not(.dark-mode) .level-details .level-name { color:#17191f !important; }
body:not(.dark-mode) .detail-line { color:#606775 !important; }
body:not(.dark-mode) #search { background:#fff !important; color:#17191f !important; border-color:#d3d7df !important; color-scheme:light; }
body:not(.dark-mode) #search::placeholder { color:#747b87 !important; }
body:not(.dark-mode) .language-trigger { background:#fff !important; color:#20242c !important; border-color:#d4d8e0 !important; }
body:not(.dark-mode) .language-menu { background:#fff !important; border-color:#d4d8e0 !important; }
body:not(.dark-mode) .language-option { color:#20242c !important; }
body:not(.dark-mode) .language-option:hover, body:not(.dark-mode) .language-option[aria-selected="true"] { background:#edf0f5 !important; }
body:not(.dark-mode) .faq-panel { background:#fff !important; color:#20242c !important; border-color:#d9dce2 !important; }
body:not(.dark-mode) .faq-answer { color:#555e6b !important; }
body:not(.dark-mode) footer { color:#69717d !important; }
body:not(.dark-mode) .extended-divider { background:#d3d7df !important; }
.theme-toggle { background:transparent !important; border-color:transparent !important; }
.theme-toggle .moon-icon { fill:#6da4ff !important; }
.theme-toggle .sun-icon { fill:#f7c948 !important; }
body:not(.dark-mode) .theme-toggle .moon-icon { display:none !important; }
body:not(.dark-mode) .theme-toggle .sun-icon { display:block !important; }
body.dark-mode .theme-toggle .moon-icon { display:block !important; }
body.dark-mode .theme-toggle .sun-icon { display:none !important; }
.metadata-row { display:flex; align-items:center; flex-wrap:wrap; gap:0; min-width:0; line-height:1.55; }
.metadata-row .detail-line { display:inline; font-size:13px; color:#aeb5c2; white-space:normal; }
.metadata-row .detail-line + .detail-line::before { content:"|"; color:#687180; padding:0 9px; }
@media(max-width:760px) { .metadata-row .detail-line { font-size:11px; } .metadata-row .detail-line + .detail-line::before { padding:0 6px; } }
@media(max-width:480px) { .metadata-row .detail-line { font-size:10px; } .metadata-row .detail-line + .detail-line::before { padding:0 4px; } }
/* Inset divider separates creator credits from level information. */
.info-divider { height:1px; width:100%; flex:0 0 1px; background:#424956; margin:10px 0 8px; }
.level-info-row { display:flex; align-items:center; flex-wrap:wrap; min-width:0; line-height:1.5; color:#aeb5c2; font-size:13px; }
.level-info-row .info-value { white-space:normal; overflow-wrap:anywhere; }
.level-info-row .info-value + .info-value::before { content:"|"; color:#687180; padding:0 9px; }
body:not(.dark-mode) .info-divider { background:#d3d7df !important; }
body:not(.dark-mode) .level-info-row { color:#606775 !important; }
@media(max-width:760px) { .info-divider { margin:7px 0 6px; } .level-info-row { font-size:11px; } .level-info-row .info-value + .info-value::before { padding:0 6px; } }
@media(max-width:480px) { .level-info-row { font-size:10px; } .level-info-row .info-value + .info-value::before { padding:0 4px; } }
.language-trigger .flag-icon, .language-option .flag-icon { width:24px !important; height:16px !important; object-fit:cover; border-radius:3px; box-shadow:0 1px 3px rgba(0,0,0,.28),0 0 0 1px rgba(120,130,145,.35); }

/* Custom background layer */
#bgLayer{position:fixed;inset:0;z-index:-1;display:none;background-size:cover;background-position:center;background-repeat:no-repeat}
#bgLayer.on{display:block}
#bgLayer::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
body:not(.dark-mode) #bgLayer::after{background:rgba(255,255,255,.25)}

/* Background dropdown */
.bg-picker{position:relative;display:inline-flex}
.bg-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:130px;padding:5px;background:#1b202b;border:1px solid #303746;border-radius:6px;box-shadow:0 8px 22px rgba(0,0,0,.35);z-index:200}
.bg-menu[hidden]{display:none}
.bg-option{width:100%;display:block;padding:9px 10px;border:0;border-radius:4px;background:transparent;color:#fff;text-align:left;font:800 12px Inter,Arial,sans-serif;letter-spacing:.4px;cursor:pointer}
.bg-option:hover{background:#414958}
body:not(.dark-mode) .bg-menu{background:#fff;border-color:#d4d8e0}
body:not(.dark-mode) .bg-option{color:#20242c}
body:not(.dark-mode) .bg-option:hover{background:#edf0f5}

/* Logo image (circle) beside the DemonVerse text */
.logo { display:inline-flex; align-items:center; gap:8px; }
.logo-text { display:inline; white-space:nowrap; }

/* Search bar uses the same font/style as the DemonVerse logo */
#search, #search::placeholder { font-family:Montserrat, Inter, Arial, sans-serif; font-style:italic; font-weight:800; letter-spacing:-.4px; }
#search { font-size:15px; }

/* ===== Roulette ===== */
.rl-overlay{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,6,9,.8);backdrop-filter:blur(3px)}
.rl-overlay[hidden]{display:none}
.rl-panel{position:relative;width:min(780px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:46px clamp(16px,5vw,50px) 30px;background:#161922;color:#f4f5f7;border:1px solid #303746;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px color-mix(in srgb,var(--accent) 12%,transparent);text-align:center}
.rl-close{position:absolute;top:10px;right:14px;width:36px;height:36px;border:0;background:transparent;color:#aeb5c2;font-size:30px;line-height:1;cursor:pointer}
.rl-close:hover{color:#fff}
.rl-title{margin:0;font-family:Montserrat,Inter,Arial,sans-serif;font-style:italic;font-weight:900;font-size:clamp(30px,6vw,46px);letter-spacing:-1.5px}
.rl-sub{margin:12px 0 26px;color:#8992a2;font-size:14px}
.rl-fields{display:grid;grid-template-columns:1fr 1fr;gap:18px;text-align:left;max-width:640px;margin:0 auto}
.rl-field label{display:block;margin:0 0 7px;font-size:14px;font-weight:600}
.rl-input{width:100%;padding:15px 16px;border:1px solid #303746;border-radius:10px;background:#1d212b;color:#f4f5f7;font:500 15px Inter,Arial,sans-serif;outline:none}
.rl-input::placeholder{color:#6f7787}
.rl-input:focus{border-color:var(--accent)}
.rl-btn{display:inline-block;min-width:min(240px,100%);margin-top:28px;padding:18px 40px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font:800 15px Inter,Arial,sans-serif;letter-spacing:.5px;cursor:pointer;transition:background .16s ease,transform .16s ease}
.rl-btn:hover{background:var(--accent-hover);transform:translateY(-1px)}
.rl-link{display:block;margin:14px auto 0;padding:6px 10px;border:0;background:transparent;color:#8992a2;font:700 12px Inter,Arial,sans-serif;letter-spacing:.6px;cursor:pointer}
.rl-link:hover{color:#fff}
.rl-msg{min-height:20px;margin:14px 0 0;color:#ff6666;font-size:13px}
.rl-prog{margin:22px 0 0;color:#8992a2;font-size:13px;font-weight:700;letter-spacing:1px}
.rl-req{margin:6px 0 4px;font-family:Montserrat,Inter,Arial,sans-serif;font-style:italic;font-weight:900;font-size:clamp(40px,9vw,64px);letter-spacing:-2px;color:var(--accent-text-2)}
.rl-card{display:grid;grid-template-columns:minmax(150px,270px) minmax(0,1fr);margin:18px 0 0;background:#1a1d24;border:1px solid #303642;text-align:left;overflow:hidden}
.rl-thumb{position:relative;display:block;min-height:150px;background:#101218 center/cover no-repeat}
.rl-thumb .rl-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.42);opacity:0;transition:opacity .18s ease}
.rl-thumb .rl-play svg{width:60px;height:60px;filter:drop-shadow(0 2px 5px #000)}
.rl-thumb.has-video:hover .rl-play,.rl-thumb.has-video:focus-visible .rl-play{opacity:1}
.rl-info{padding:18px 20px;min-width:0}
.rl-name{margin:0 0 8px;font-size:20px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.rl-name .rk{color:#e04444;margin-right:8px;font-weight:900}
.rl-row{font-size:13px;line-height:1.55;color:#aeb5c2}
.rl-row span+span::before{content:"|";color:#687180;padding:0 9px}
.rl-row.second{margin-top:10px;padding-top:10px;border-top:1px solid #424956}
.rl-results{list-style:none;margin:18px 0 0;padding:0;max-height:260px;overflow:auto;text-align:left;border:1px solid #303642;background:#1a1d24}
.rl-results li{display:flex;justify-content:space-between;gap:14px;padding:10px 16px;border-top:1px solid #292e39;font-size:14px}
.rl-results li:first-child{border-top:0}
.rl-results .rk{color:#e04444;font-weight:900;margin-right:8px}
.rl-results .pc{color:var(--accent-text-2);font-weight:800;white-space:nowrap}
.rl-empty{margin:20px 0 0;color:#8992a2}
body:not(.dark-mode) .rl-overlay{background:rgba(240,242,246,.82)}
body:not(.dark-mode) .rl-panel{background:#fff;color:#17191f;border-color:#d9dce2;box-shadow:0 20px 60px rgba(0,0,0,.18)}
body:not(.dark-mode) .rl-close{color:#69717d}
body:not(.dark-mode) .rl-close:hover,body:not(.dark-mode) .rl-link:hover{color:#000}
body:not(.dark-mode) .rl-sub,body:not(.dark-mode) .rl-prog,body:not(.dark-mode) .rl-link,body:not(.dark-mode) .rl-empty{color:#69717d}
body:not(.dark-mode) .rl-input{background:#f4f5f7;color:#17191f;border-color:#d3d7df}
body:not(.dark-mode) .rl-card,body:not(.dark-mode) .rl-results{background:#f8f9fb;border-color:#d9dce2}
body:not(.dark-mode) .rl-row{color:#606775}
body:not(.dark-mode) .rl-row.second{border-top-color:#d3d7df}
body:not(.dark-mode) .rl-results li{border-top-color:#e2e5ea}
body:not(.dark-mode) body:not(.dark-mode) body:not(.dark-mode) @media(max-width:560px){.rl-fields{grid-template-columns:1fr}.rl-card{grid-template-columns:1fr}.rl-thumb{min-height:0;aspect-ratio:16/9}.rl-btn{padding:16px 24px}}

/* Spinning roulette wheel icon in the header */
.wheel-spin{animation:wheelSpin 4s linear infinite;transform-origin:12px 10px}
@keyframes wheelSpin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.wheel-spin{animation:none}}
/* "GET _%" pop when the percentage goes up */
.rl-req.rl-bump{animation:rlBump .6s cubic-bezier(.2,.9,.3,1.25)}
@keyframes rlBump{
0%{transform:scale(.55) translateY(16px);opacity:0;filter:blur(5px)}
55%{transform:scale(1.18) translateY(0);opacity:1;filter:blur(0);text-shadow:0 0 30px color-mix(in srgb,var(--accent) 80%,transparent)}
100%{transform:scale(1);text-shadow:0 0 0 transparent}
}
@media(prefers-reduced-motion:reduce){.rl-req.rl-bump{animation:none}}
/* Level card slide-in in the roulette */
.rl-card.rl-slide{animation:rlSlide .55s cubic-bezier(.2,.85,.25,1)}
@keyframes rlSlide{
0%{transform:translateX(70px) scale(.96);opacity:0;border-color:var(--accent)}
60%{opacity:1;border-color:var(--accent)}
100%{transform:none;opacity:1}
}
@media(prefers-reduced-motion:reduce){.rl-card.rl-slide{animation:none}}

/* Light/dark toggle sits closer to the language picker */
#themeToggle{margin-right:-14px}
@media(max-width:760px){#themeToggle{margin-right:-4px}}
/* ===== Slightly bigger level spots (list is 100px wider than before) ===== */
@media(min-width:761px){
.list-container{max-width:1000px}
.level-card{grid-template-columns:minmax(240px,290px) minmax(0,1fr);min-height:160px}
.thumbnail{min-height:158px}
.level-details{padding:20px 24px 18px;justify-content:center}
.level-name{font-size:20px;margin-bottom:10px}
.metadata-row .detail-line,.level-info-row{font-size:14px}
.metadata-row .detail-line + .detail-line::before,.level-info-row .info-value + .info-value::before{padding:0 10px}
.info-divider{margin:12px 0 10px}
.level-card.has-badges .level-details{padding-top:52px}
.lvl-badge{width:100px}
.badge-winner{width:108px}
}
@media(min-width:481px) and (max-width:760px){
.level-card{grid-template-columns:minmax(140px,36%) minmax(0,1fr);min-height:128px}
.thumbnail{min-height:126px}
.level-details{padding:14px 14px 11px}
.level-name{font-size:16px}
.metadata-row .detail-line,.level-info-row{font-size:12px}
}
@media(max-width:480px){
.level-card{grid-template-columns:120px minmax(0,1fr);min-height:112px}
.thumbnail{min-height:110px}
.level-details{padding:11px 10px 9px}
.level-name{font-size:14px}
.metadata-row .detail-line,.level-info-row{font-size:11px}
}

/* Line between the search bar and the first spot */
.search-divider{max-width:1000px;margin:18px auto 0;padding:0 18px}
.search-divider::before{content:"";display:block;height:1px;background:#424956}
body:not(.dark-mode) .search-divider::before{background:#d3d7df}
/* Roulette results: full level spots */
.rl-card{position:relative}
.rl-list{display:grid;gap:12px}
.rl-list .rl-card{margin:0}
.rl-sec{margin:30px 0 0;padding-top:22px;border-top:1px solid #303746;text-align:left;font:800 15px Inter,Arial,sans-serif;letter-spacing:.6px}
.rl-sec span{color:#8992a2;font-weight:700}
.rl-sec + .rl-list,.rl-sec + .rl-empty{margin-top:14px}
.rl-card.has-tag .rl-info{padding-right:84px}
.rl-tag{position:absolute;top:10px;right:10px;z-index:2;padding:5px 11px;border-radius:6px;font:800 13px Inter,Arial,sans-serif;letter-spacing:.3px}
.rl-tag.ok{background:var(--accent);color:var(--on-accent)}
.rl-tag.miss{background:rgba(12,14,18,.78);color:#aeb5c2;border:1px dashed #687180}
.rl-card.miss{opacity:.82;filter:grayscale(.35)}
.rl-card.miss:hover{opacity:1;filter:none}
body:not(.dark-mode) .rl-sec{border-top-color:#d9dce2}
body:not(.dark-mode) .rl-tag.miss{background:rgba(255,255,255,.86);color:#606775;border-color:#a5acb8}
@media(max-width:560px){.rl-card.has-tag .rl-info{padding-right:20px}}
/* Give-up animation + animated results */
.rl-card.rl-fail{animation:rlFail .65s ease forwards}
@keyframes rlFail{
0%{transform:none}
15%{transform:translateX(-12px)}
30%{transform:translateX(10px)}
45%{transform:translateX(-8px);border-color:#d62828}
60%{transform:translateX(5px);filter:grayscale(.6) brightness(.85)}
100%{transform:translateY(16px) scale(.95);opacity:0;filter:grayscale(1) brightness(.6)}
}
.rl-req.rl-failtext{animation:rlFailText .65s ease forwards}
@keyframes rlFailText{to{opacity:0;transform:scale(.8) translateY(10px);filter:blur(4px)}}
.rl-anim .rl-over{animation:rlSlam .6s cubic-bezier(.2,.9,.3,1.3) backwards}
@keyframes rlSlam{0%{transform:scale(2.3);opacity:0;filter:blur(8px)}60%{transform:scale(.94);opacity:1;filter:blur(0)}}
@keyframes rlFadeUp{from{opacity:0;transform:translateY(18px)}}
.rl-anim .rl-sub,.rl-anim .rl-btn{animation:rlFadeUp .45s ease .35s backwards}
.rl-anim .rl-sec{animation:rlFadeUp .45s ease .5s backwards}
.rl-anim .rl-list .rl-card{animation:rlFadeUp .45s ease backwards;animation-delay:calc(.55s + var(--i,0) * .06s)}
@media(prefers-reduced-motion:reduce){.rl-card.rl-fail,.rl-req.rl-failtext,.rl-anim *{animation:none !important}}
/* ===== Front page ===== */
#homeView[hidden],#listView[hidden]{display:none}
.home{max-width:1100px;margin:0 auto;padding:54px 18px 30px;text-align:center}
.hm-kicker{margin:0 0 14px;font:800 clamp(18px,3.4vw,26px) Inter,Arial,sans-serif;letter-spacing:.32em;color:var(--accent-text-2)}
.hm-headline{max-width:640px;margin:0 auto;font:800 clamp(22px,3.6vw,31px)/1.28 Inter,Arial,sans-serif;color:#e4e7ec}
.hm-stats{display:flex;justify-content:center;margin:40px auto 34px;max-width:620px}
.hm-stat{flex:1;padding:4px 14px;border-left:1px solid #292e39}
.hm-stat:first-child{border-left:0}
.hm-stat svg{width:20px;height:20px;fill:var(--accent-text-2);display:block;margin:0 auto 8px}
.hm-stat b{display:block;font:900 clamp(26px,5vw,38px) Inter,Arial,sans-serif;letter-spacing:.5px}
.hm-stat span{display:block;margin-top:6px;font:700 11px Inter,Arial,sans-serif;letter-spacing:.14em;color:#8992a2}
.hm-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}
.hm-btn{display:inline-flex;align-items:center;gap:9px;padding:13px 22px;border:1px solid #303746;border-radius:8px;background:#161b26;color:#f4f5f7;font:700 15px Inter,Arial,sans-serif;text-decoration:none;cursor:pointer;transition:background .16s ease,transform .16s ease,border-color .16s ease}
.hm-btn:hover{background:#202637;border-color:#4a5261;transform:translateY(-1px)}
.hm-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hm-btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.hm-btn svg{width:18px;height:18px;flex:0 0 18px}
.hm-social{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:18px}
.hm-chip{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1px solid #303746;border-radius:7px;background:#131722;color:#d4d9e2;font:600 13px Inter,Arial,sans-serif;text-decoration:none}
.hm-chip:hover{background:#1c2230;color:#fff}
.hm-chip svg{width:15px;height:15px;fill:currentColor}
.hm-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;margin-top:44px;text-align:left;align-items:start}
.hm-panel{padding:20px 22px;background:#131722;border:1px solid #292e39;border-radius:12px}
.hm-panel h2{margin:0 0 14px;font:800 17px Inter,Arial,sans-serif}
.hm-scroll{max-height:400px;overflow:auto;padding-right:6px}
.rc-date{display:flex;align-items:center;gap:12px;margin:14px 0 8px;font:700 10px Inter,Arial,sans-serif;letter-spacing:.16em;color:#6f7a90}
.rc-date:first-child{margin-top:0}
.rc-date::before,.rc-date::after{content:"";flex:1;height:1px;background:#292e39}
.rc-item{display:flex;align-items:flex-start;gap:12px;padding:9px 4px;font-size:13px;line-height:1.5;color:#8992a2}
.rc-ico{flex:0 0 22px;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:900 13px/1 Inter,Arial,sans-serif;margin-top:1px}
.rc-ico.add{background:rgba(34,197,94,.16);color:#4ade80}
.rc-ico.mv{background:rgba(250,204,21,.16);color:#facc15}
.rc-ico.rm{background:rgba(239,68,68,.16);color:#f87171}
.rc-name{border:0;padding:0;margin-right:6px;background:transparent;color:#f4f5f7;font:700 14px Inter,Arial,sans-serif;cursor:pointer}
button.rc-name:hover{color:var(--accent-text-2);text-decoration:underline}
.rc-item em{font-style:normal;color:#7da2d6}
.why-item{display:flex;gap:14px;padding:12px 0}
.why-ico{flex:0 0 34px;width:34px;height:34px;border-radius:8px;background:#1c2230;display:flex;align-items:center;justify-content:center}
.why-ico svg{width:18px;height:18px;fill:var(--accent-text-2)}
.why-ico svg[fill="none"]{fill:none}
.why-item h3{margin:0 0 4px;font:700 14px Inter,Arial,sans-serif}
.why-item p{margin:0;font-size:12.5px;line-height:1.5;color:#8992a2}
.hm-empty{margin:6px 0;color:#8992a2;font-size:13px}
@media(max-width:860px){.hm-grid{grid-template-columns:1fr}}
@media(max-width:520px){.home{padding-top:34px}.hm-stat{padding:4px 6px}.hm-btn{width:100%;justify-content:center}}
body:not(.dark-mode) .hm-headline{color:#20242c}
body:not(.dark-mode) .hm-stat{border-left-color:#d9dce2}
body:not(.dark-mode) .hm-stat span,body:not(.dark-mode) .rc-item,body:not(.dark-mode) .why-item p,body:not(.dark-mode) .hm-empty{color:#606775}
body:not(.dark-mode) .hm-btn{background:#fff;border-color:#d3d7df;color:#20242c}
body:not(.dark-mode) .hm-btn:hover{background:#f1f3f7}
body:not(.dark-mode) .hm-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
body:not(.dark-mode) .hm-chip{background:#fff;border-color:#d3d7df;color:#363c47}
body:not(.dark-mode) .hm-chip:hover{background:#f1f3f7;color:#000}
body:not(.dark-mode) .hm-panel{background:#fff;border-color:#d9dce2}
body:not(.dark-mode) .rc-date::before,body:not(.dark-mode) .rc-date::after{background:#e2e5ea}
body:not(.dark-mode) .rc-date{color:#8992a2}
body:not(.dark-mode) .rc-name{color:#17191f}
body:not(.dark-mode) .rc-item em{color:#3b6bb0}
body:not(.dark-mode) .why-ico{background:#eef0f5}
/* Front page: red & white colour scheme */
.hm-panel{background:#15161c;border-color:color-mix(in srgb,var(--accent) 32%,#2a2d36)}
.hm-panel h2{display:flex;align-items:center;gap:10px}
.hm-panel h2::before{content:"";flex:0 0 4px;width:4px;height:18px;border-radius:2px;background:var(--accent)}
.rc-item em{color:var(--accent-text-2)}
.why-ico{background:color-mix(in srgb,var(--accent) 16%,#15161c)}
.hm-btn{background:#17181e;border-color:#2c2f38}
.hm-btn:hover{background:#21232b;border-color:var(--accent)}
.hm-chip{background:#15161c;border-color:#2c2f38}
.hm-chip:hover{background:#1d1e25;border-color:var(--accent);color:#fff}
.hm-stat{border-left-color:#2a2d36}
body:not(.dark-mode) .hm-panel{background:#fff;border-color:color-mix(in srgb,var(--accent) 28%,#d9dce2)}
body:not(.dark-mode) .rc-item em{color:var(--accent-text)}
body:not(.dark-mode) .why-ico{background:color-mix(in srgb,var(--accent) 12%,#fff)}
body:not(.dark-mode) .hm-chip:hover{border-color:var(--accent)}
.hm-stat b.txt{font-size:clamp(16px,3vw,25px);line-height:1.7;letter-spacing:0;white-space:nowrap}
.rc-ico svg{width:13px;height:13px;display:block}
.rc-ico.add{color:#4ade80}
.rc-ico.rm{color:#ff5a5a}

/* Front page: click animations + page transitions */
.hm-btn{position:relative;overflow:hidden}
.hm-ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.38);transform:scale(0);animation:hmRipple .65s ease-out forwards;pointer-events:none}
@keyframes hmRipple{to{transform:scale(1);opacity:0}}
.hm-btn.hm-press{animation:hmPress .4s ease}
@keyframes hmPress{40%{transform:scale(.94)}}
.hm-btn.hm-press svg{animation:hmArrow .5s ease}
@keyframes hmArrow{50%{transform:translateX(12px)}}
.hm-btn.hm-spin svg{animation:hmSpin .55s cubic-bezier(.4,0,.2,1)}
@keyframes hmSpin{to{transform:rotate(720deg)}}
.hm-btn.hm-pop svg{animation:hmPop .55s ease}
@keyframes hmPop{30%{transform:scale(1.55) rotate(-14deg)}60%{transform:scale(.9) rotate(8deg)}}
.hm-leave{animation:hmLeave .3s ease forwards}
@keyframes hmLeave{to{opacity:0;transform:translateY(-18px) scale(.98)}}
.view-in{animation:viewIn .45s cubic-bezier(.2,.8,.25,1) backwards}
@keyframes viewIn{from{opacity:0;transform:translateY(18px)}}
@media(prefers-reduced-motion:reduce){.hm-btn.hm-press,.hm-btn svg,.hm-leave,.view-in,.hm-ripple{animation:none !important}}
</style>

let currentLanguage = "en";
const tr = key => translations[currentLanguage][key] || translations.en[key] || key;

function updateLanguageInterface() {
document.documentElement.lang = currentLanguage;
const subtitle = document.querySelector(".subtitle");
if (subtitle) subtitle.textContent = tr("subtitle");
document.querySelector("footer").textContent = tr("footer");
document.getElementById("search").placeholder = tr("searchMain");

const codes = { en: "ENG", ru: "RUS", es: "ESP", fr: "FRE" };
document.getElementById("currentLanguageCode").textContent = codes[currentLanguage];
document.getElementById("currentLanguageFlag").innerHTML = languageFlags[currentLanguage];
document.getElementById("languageTrigger").setAttribute("aria-label", tr("chooseLanguage"));

document.querySelectorAll(".language-option").forEach(option => {
const selected = option.dataset.language === currentLanguage;
option.setAttribute("aria-selected", String(selected));
option.querySelector(".flag-icon").outerHTML = languageFlags[option.dataset.language];
});

const dark = document.body.classList.contains("dark-mode");
const themeToggle = document.getElementById("themeToggle");
themeToggle.setAttribute("aria-label", dark ? tr("switchLight") : tr("switchDark"));
themeToggle.title = dark ? tr("switchLight") : tr("switchDark");


document.getElementById("faqHeading").textContent = tr("faqTitle");
document.getElementById("faqItems").innerHTML = (translations[currentLanguage].faq || translations.en.faq)
  .map(([q, a]) => `<div class="faq-item"><h3 class="faq-question">${q}</h3><p class="faq-answer">${a}</p></div>`).join("");
document.getElementById("bgDefault").textContent = tr("bgDefault");
document.getElementById("bgUpload").textContent = tr("bgUpload");
document.getElementById("bgToggle").title = tr("bgLabel");
document.getElementById("bgToggle").setAttribute("aria-label", tr("bgLabel"));
if (window.rouletteRefresh) window.rouletteRefresh();
if (window.renderHome) window.renderHome();

displayLevels(levels, "main");
}

(() => {
const picker = document.getElementById("languagePicker");
const trigger = document.getElementById("languageTrigger");
const closePicker = () => {
picker.classList.remove("open");
trigger.setAttribute("aria-expanded", "false");
};

trigger.addEventListener("click", () => {
const opening = !picker.classList.contains("open");
picker.classList.toggle("open", opening);
trigger.setAttribute("aria-expanded", String(opening));
});

picker.querySelectorAll(".language-option").forEach(option => {
option.addEventListener("click", () => {
currentLanguage = option.dataset.language;
closePicker();
updateLanguageInterface();
});
});

document.addEventListener("click", event => {
if (!picker.contains(event.target)) closePicker();
});
document.addEventListener("keydown", event => {
if (event.key === "Escape") closePicker();
});
})();

const swapLevels = (a, b) => {
  const ia = levels.findIndex(x => x.name && x.name.toLowerCase() === a.toLowerCase());
  const ib = levels.findIndex(x => x.name && x.name.toLowerCase() === b.toLowerCase());
  if (ia >= 0 && ib >= 0) [levels[ia], levels[ib]] = [levels[ib], levels[ia]];
};
swapLevels("Amethyst", "Artemis 13");
swapLevels("andromeda", "Herr Machine");
// Editable blank spots are written inline in the arrays above, beside their list positions.
// Position cap: the list is limited to exactly 150 positions (blank slots count).
// Anything past #150 at the bottom of the Extended List is cut off automatically.
const MAX_POSITIONS = 150;
if (levels.length + extendedLevels.length > MAX_POSITIONS) extendedLevels.splice(MAX_POSITIONS - levels.length);

const WINNER_BADGE = `<span class="lvl-badge badge-winner" role="img" aria-label="2026 LW"><svg viewBox="0 0 452 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="winnerGold" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#fff06a"/><stop offset=".18" stop-color="#ffbf00"/><stop offset=".48" stop-color="#d98200"/><stop offset=".72" stop-color="#ffca18"/><stop offset="1" stop-color="#a94d00"/></linearGradient><linearGradient id="winnerShine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".48"/><stop offset=".3" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#7b3500" stop-opacity=".16"/></linearGradient></defs><rect x="1.5" y="1.5" width="449" height="97" rx="24" fill="#8b4300"/><rect x="4" y="4" width="444" height="92" rx="21" fill="url(#winnerGold)" stroke="#ffe45b" stroke-width="3"/><rect x="9" y="9" width="434" height="82" rx="17" fill="url(#winnerShine)" stroke="#fff2a0" stroke-opacity=".8" stroke-width="1.5"/><path d="M23 13H429" stroke="#fff" stroke-opacity=".7" stroke-width="2"/><text x="226" y="69" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="900" letter-spacing="1" fill="#fff">2026 LW</text></svg></span>`;

function createLevelCard(level, index) {
  const rank = index + 1;
  const glowClass = rank === 1 && !level.blank ? "gold-glow" : (rank >= 4 && rank <= 10 ? "white-glow" : "");
  const isEmptySlot = !level.name && !level.host && !level.verifier && !level.image && !level.verification && !level.id && !level.length;
  const displayValue = value => (!value || String(value).trim().toLowerCase() === "not added") ? tr("notAdded") : value;
  const nameKey = String(level.name || "").trim().toLowerCase();
    // Set the exact level name here when selecting the 2026 winner.
  const winner2026Level = "";
  const is2026Winner = !level.blank && winner2026Level.trim().toLowerCase() === nameKey;
  const badges = is2026Winner ? `<div class="level-badges">${WINNER_BADGE}</div>` : "";
  const hasVideo = !!(level.verification && /^https?:\/\//i.test(level.verification));
  const thumbnail = `<div class="thumbnail ${level.image ? "" : "blank-thumbnail"} ${hasVideo ? "has-verification" : ""}" style="${level.image ? `background-image:url('${level.image}');` : ""}" ${hasVideo ? `role="link" tabindex="0" onclick="window.open('${level.verification}','_blank','noopener')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.open('${level.verification}','_blank','noopener')}" aria-label="Watch verification video for ${String(level.name || "level").replace(/&/g,"&amp;").replace(/'/g,"&#39;")}"` : 'aria-label="Level thumbnail"'}>${hasVideo ? `<span class="thumb-play" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="rgba(12,14,18,.72)" stroke="#fff" stroke-width="2"/><path d="M26 19 45 32 26 45Z" fill="#fff"/></svg></span>` : ""}</div>`;
  return `<article class="level-card ${glowClass} ${isEmptySlot ? "blank-level" : ""} ${is2026Winner ? "has-badges" : ""}">${badges}${thumbnail}<div class="level-details"><div class="level-name" data-rank="#${rank}">${isEmptySlot ? "" : level.name}</div><div class="metadata-row"><span class="detail-line host-value">${isEmptySlot ? "" : `${displayValue(level.host)}`}</span><span class="detail-line verifier-value">${isEmptySlot ? "" : `${displayValue(level.verifier)}`}</span></div><div class="info-divider" aria-hidden="true"></div><div class="level-info-row"><span class="info-value level-id-value">${isEmptySlot ? "" : displayValue(level.id)}</span><span class="info-value level-length-value">${isEmptySlot ? "" : displayValue(level.length)}</span></div></div></article>`;
}

function displayLevels(levelArray, view = "main") {
const list = document.getElementById("level-list");
list.innerHTML = "";
let dividerPlaced = false;
levelArray.forEach((level, index) => {
const originalIndex = view === "main" ? levels.indexOf(level) : index;
const rankIndex = originalIndex >= 0 ? originalIndex : index;
// Thin grey divider sits between #75 and #76.
if (view === "main" && !dividerPlaced && rankIndex >= 75) {
if (index > 0) list.innerHTML += '<div class="extended-divider"></div>';
dividerPlaced = true;
}
list.innerHTML += createLevelCard(level, rankIndex);
});
displayExtended(levelArray, view, dividerPlaced);
}

// Extended List: only shown in the Main List view, below the main cards, and filtered by the same search box.
function displayExtended(levelArray, view, dividerPlaced) {
const extList = document.getElementById("extended-list");
extList.innerHTML = "";
if (view !== "main") return;
const term = levelArray === levels ? "" : document.getElementById("search").value.toLowerCase();
let count = 0;
extendedLevels.forEach((level, i) => {
if (!(level.name || "").toLowerCase().includes(term)) return;
extList.innerHTML += createLevelCard(level, levels.length + i);
count++;
});
// If a search hid every card from #76 on in the Main List, still draw the divider before the Extended results.
if (!dividerPlaced && count > 0 && document.getElementById("level-list").children.length > 0) extList.innerHTML = '<div class="extended-divider"></div>' + extList.innerHTML;
}

document
.getElementById("search")
.addEventListener(
"input",
function() {

const searchTerm =
this.value.toLowerCase();


const filteredLevels = levels.filter(level =>
(level.name || "").toLowerCase().includes(searchTerm)
);

displayLevels(filteredLevels, "main");

}
);

// ===== Falling snow =====
(() => {
const reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

// --- Snow: slow, gentle flakes drifting down the whole screen ---
const canvas = document.getElementById("snowCanvas");
const ctx = canvas && canvas.getContext ? canvas.getContext("2d") : null;
if (ctx && !reduceMotion) {
let w = 0, h = 0, dpr = 1, flakes = [];
const makeFlake = initial => ({
x: Math.random() * w,
y: initial ? Math.random() * h : -8,
r: 1 + Math.random() * 2.4,          // size
speed: 22 + Math.random() * 38,      // px per second (slow)
sway: 8 + Math.random() * 16,        // side-to-side drift
phase: Math.random() * Math.PI * 2,
rot: Math.random() * Math.PI * 2,      // each flake is turned a different way
spin: (Math.random() - 0.5) * 0.6,   // and turns very slowly as it falls
alpha: 0.45 + Math.random() * 0.5
});
// A snowflake: six arms, each with two little branches (tiny flakes are just six spokes)
const drawFlake = (x, y, r, rot, color) => {
const L = r * 1.7;
ctx.save();
ctx.translate(x, y);
ctx.rotate(rot);
ctx.strokeStyle = color;
ctx.lineCap = "round";
ctx.lineWidth = Math.max(0.7, r * 0.34);
ctx.beginPath();
for (let i = 0; i < 6; i++) {
const a = i * Math.PI / 3, ca = Math.cos(a), sa = Math.sin(a);
ctx.moveTo(0, 0);
ctx.lineTo(ca * L, sa * L);
if (r > 1.6) {
const bx = ca * L * 0.55, by = sa * L * 0.55, bl = L * 0.42;
for (const side of [-1, 1]) {
const b = a + side * Math.PI / 3.2;
ctx.moveTo(bx, by);
ctx.lineTo(bx + Math.cos(b) * bl, by + Math.sin(b) * bl);
}
}
}
ctx.stroke();
ctx.restore();
};
const resize = () => {
dpr = Math.min(window.devicePixelRatio || 1, 2);
w = window.innerWidth; h = window.innerHeight;
canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
const count = Math.max(45, Math.min(130, Math.round(w * h / 16000)));
while (flakes.length < count) flakes.push(makeFlake(true));
flakes.length = count;
};
resize();
window.addEventListener("resize", resize);
let last = performance.now();
const frame = now => {
const dt = Math.min((now - last) / 1000, 0.1);
last = now;
const dark = document.body.classList.contains("dark-mode");
ctx.clearRect(0, 0, w, h);
for (const f of flakes) {
f.y += f.speed * dt;
f.phase += dt * 0.8;
const x = f.x + Math.sin(f.phase) * f.sway;
if (f.y - f.r > h) { Object.assign(f, makeFlake(false)); continue; }
f.rot += f.spin * dt;
// white snow on dark mode, soft blue-grey snow on light mode so it stays visible
drawFlake(x, f.y, f.r, f.rot, dark ? "rgba(255,255,255," + f.alpha + ")" : "rgba(100,135,185," + f.alpha + ")");
}
requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
}
})();

// Custom background (saved locally per visitor in IndexedDB)
(() => {
  const layer = document.getElementById("bgLayer"), picker = document.getElementById("bgPicker"),
        toggle = document.getElementById("bgToggle"), menu = document.getElementById("bgMenu"),
        file = document.getElementById("bgFile");
  const openDB = () => new Promise((res, rej) => {
    const r = indexedDB.open("demonverseBg", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("bg");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const idb = async (mode, fn) => {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction("bg", mode), rq = fn(tx.objectStore("bg"));
      tx.oncomplete = () => res(rq.result); tx.onerror = () => rej(tx.error);
    });
  };
  let url = null;
  const apply = blob => {
    if (url) URL.revokeObjectURL(url);
    if (!blob) { url = null; layer.classList.remove("on"); layer.style.backgroundImage = ""; return; }
    url = URL.createObjectURL(blob);
    layer.style.backgroundImage = `url("${url}")`;
    layer.classList.add("on");
  };
  const closeMenu = () => { menu.hidden = true; toggle.setAttribute("aria-expanded", "false"); };

  toggle.addEventListener("click", () => {
    const open = menu.hidden; menu.hidden = !open;
    toggle.setAttribute("aria-expanded", String(open));
  });
  document.addEventListener("click", e => { if (!picker.contains(e.target)) closeMenu(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });

  document.getElementById("bgUpload").addEventListener("click", () => { closeMenu(); file.click(); });
  document.getElementById("bgDefault").addEventListener("click", async () => {
    closeMenu(); apply(null);
    try { await idb("readwrite", s => s.delete("custom")); } catch (e) {}
  });
  file.addEventListener("change", async () => {
    const f = file.files && file.files[0];
    file.value = "";
    if (!f || !f.type.startsWith("image/")) return;
    apply(f);
    try { await idb("readwrite", s => s.put(f, "custom")); } catch (e) {}
  });

  idb("readonly", s => s.get("custom")).then(b => { if (b) apply(b); }).catch(() => {});
})();


// ===== Roulette =====
(() => {
  const KEY = "demonverseRoulette";
  const $ = id => document.getElementById(id);
  const overlay = $("rlOverlay"), view = $("rlView"), openBtn = $("openRoulette"), closeBtn = $("rlClose");
  const esc = v => String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const all = () => levels.concat(extendedLevels);
  const TOP = () => Math.min(150, all().length);
  const fmt = (key, vars) => Object.keys(vars).reduce((t, k) => t.replace("{" + k + "}", vars[k]), tr(key));

  // Saved runs store level NAMES (not positions), so adding / moving / removing levels never scrambles a saved run.
  const migrate = o => {
    if (o && Array.isArray(o.order) && o.order.some(Number.isInteger)) {
      const list = all(), nm = r => list[r - 1] && list[r - 1].name;
      o.order = o.order.map(nm);
      if (Array.isArray(o.done)) o.done = o.done.map(d => d && Number.isInteger(d.rank) ? { name: nm(d.rank), percent: d.percent } : d);
    }
    return o;
  };
  const valid = o => {
    if (!o || typeof o !== "object") return false;
    if (!["playing", "cleared", "finished"].includes(o.status)) return false;
    if (!Array.isArray(o.order) || !o.order.length || !o.order.every(n => typeof n === "string" && n)) return false;
    if (new Set(o.order).size !== o.order.length) return false;
    if (!Number.isInteger(o.pos) || o.pos < 0 || o.pos >= o.order.length) return false;
    if (!Number.isInteger(o.req) || o.req < 1 || o.req > 100) return false;
    if (!Array.isArray(o.done) || !o.done.every(d => d && typeof d.name === "string" && d.name && Number.isInteger(d.percent) && d.percent >= 1 && d.percent <= 100)) return false;
    return true;
  };
  let state = null;
  try { const o = migrate(JSON.parse(localStorage.getItem(KEY))); if (valid(o)) state = o; } catch (e) {}
  const save = () => { try { state ? localStorage.setItem(KEY, JSON.stringify(state)) : localStorage.removeItem(KEY); } catch (e) {} };

  // Keeps a saved run up to date with the list: levels added to the list are slipped into the remaining
  // levels of the run at random spots, and levels that were removed are dropped.
  const syncState = () => {
    if (!state) return;
    const list = all(), names = new Set(list.filter(l => l.name).map(l => l.name));
    let changed = false;
    const before = state.order.slice(0, state.pos).filter(n => names.has(n)).length;
    const kept = state.order.filter(n => names.has(n));
    if (kept.length !== state.order.length) { state.order = kept; state.pos = before; changed = true; }
    if (!Array.isArray(state.pool)) state.pool = state.order.concat(state.done.map(d => d.name));
    if (state.status !== "finished") {
      const seen = new Set(state.pool), lo = state.start || 1, hi = state.end || TOP();
      for (let r = lo; r <= hi; r++) {
        const l = list[r - 1];
        if (l && l.name && !seen.has(l.name)) {
          const at = state.pos + 1 + Math.floor(Math.random() * (state.order.length - state.pos));
          state.order.splice(at, 0, l.name); state.pool.push(l.name); seen.add(l.name); changed = true;
        }
      }
    }
    if (!state.order.length) { state.status = "finished"; state.pos = 0; changed = true; }
    else if (state.pos >= state.order.length) { state.status = "finished"; state.pos = state.order.length - 1; changed = true; }
    if (changed) save();
  };

  const clampRange = (v, def) => {
    if (v === "" || v == null) return def;
    const n = parseInt(v, 10);
    if (isNaN(n)) return def;
    return Math.min(Math.max(n, 1), TOP());
  };

  const levelCard = (name, tag, kind) => {
    const idx = all().findIndex(l => l.name === name), rank = idx + 1, L = all()[idx];
    const tagHtml = tag ? '<span class="rl-tag ' + (kind || "ok") + '">' + esc(tag) + '</span>' : "";
    const cls = "rl-card" + (tag ? " has-tag" : "") + (kind === "miss" ? " miss" : "");
    if (!L) return '<div class="' + cls + '" style="grid-template-columns:1fr">' + tagHtml + '<div class="rl-info"><h3 class="rl-name">' + esc(name) + '</h3></div></div>';
    const dv = v => (!v || String(v).trim().toLowerCase() === "not added") ? tr("notAdded") : esc(v);
    const hasVideo = !!(L.verification && /^https?:\/\//i.test(L.verification));
    const img = L.image ? "background-image:url('" + String(L.image).replace(/'/g, "%27").replace(/"/g, "%22") + "')" : "";
    const play = '<span class="rl-play" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="rgba(12,14,18,.72)" stroke="#fff" stroke-width="2"/><path d="M26 19 45 32 26 45Z" fill="#fff"/></svg></span>';
    const thumb = hasVideo
      ? '<a class="rl-thumb has-video" href="' + esc(L.verification) + '" target="_blank" rel="noopener noreferrer" style="' + img + '" aria-label="' + esc(tr("verificationVideo")) + '">' + play + '</a>'
      : '<div class="rl-thumb" style="' + img + '"></div>';
    return '<div class="' + cls + '">' + tagHtml + thumb + '<div class="rl-info"><h3 class="rl-name"><span class="rk">#' + rank + '</span>' + esc(L.name) + '</h3>' +
      '<div class="rl-row"><span>' + dv(L.host) + '</span><span>' + dv(L.verifier) + '</span></div>' +
      '<div class="rl-row second"><span>' + dv(L.id) + '</span><span>' + dv(L.length) + '</span></div></div></div>';
  };

  const rankTag = name => { const i = all().findIndex(l => l.name === name); return i >= 0 ? "#" + (i + 1) : ""; };

  let animateNext = false;
  const render = () => {
    view.className = animateNext ? "rl-anim" : ""; animateNext = false;
    $("rlTitle").textContent = tr("rlTitle");
    closeBtn.setAttribute("aria-label", tr("rlClose"));
    let html = "";
    if (!state) {
      html = '<p class="rl-sub">' + tr("rlSub") + '</p>' +
        '<div class="rl-fields"><div class="rl-field"><label for="rlFrom">' + tr("rlFrom") + '</label><input class="rl-input rl-range" id="rlFrom" type="number" inputmode="numeric" min="1" max="' + TOP() + '" step="1" placeholder="1"></div>' +
        '<div class="rl-field"><label for="rlTo">' + tr("rlTo") + '</label><input class="rl-input rl-range" id="rlTo" type="number" inputmode="numeric" min="1" max="' + TOP() + '" step="1" placeholder="' + TOP() + '"></div></div>' +
        '<button class="rl-btn" type="button" data-act="start">' + tr("rlStart") + '</button><p class="rl-msg" id="rlMsg" role="alert"></p>';
    } else if (state.status === "finished") {
      const best = state.done.length ? state.done[state.done.length - 1].percent : 0;
      // What the run would have looked like if it hadn't ended: the unfinished level and the ones after it, each needing 1% more.
      const doneNames = new Set(state.done.map(d => d.name));
      const startPct = best + 1, missed = [];
      state.order.slice(state.pos).filter(n => !doneNames.has(n)).forEach((n, i) => { if (startPct + i <= 100) missed.push({ name: n, percent: startPct + i }); });
      html = '<p class="rl-req rl-over" style="font-size:clamp(28px,6vw,40px)">' + tr("rlOver") + '</p><p class="rl-sub" style="margin:4px 0 0">' + fmt("rlHighest", { p: best }) + '</p>' +
        '<button class="rl-btn" type="button" data-act="new" style="margin-top:20px">' + tr("rlNew") + '</button>' +
        '<h3 class="rl-sec">' + tr("rlDoneTitle") + ' <span>(' + state.done.length + ')</span></h3>' +
        (state.done.length
          ? '<div class="rl-list">' + state.done.map(d => levelCard(d.name, d.percent + "%", "ok")).join("") + '</div>'
          : '<p class="rl-empty">' + tr("rlNone") + '</p>') +
        (missed.length
          ? '<h3 class="rl-sec">' + tr("rlMissedTitle") + ' <span>(' + missed.length + ')</span></h3><div class="rl-list">' + missed.map(d => levelCard(d.name, d.percent + "%", "miss")).join("") + '</div>'
          : '');
    } else {
      const rank = state.order[state.pos];  // (this is the level's name)
      html = '<p class="rl-prog">' + fmt("rlLevelN", { n: state.pos + 1 }) + '</p>' +
        '<div class="rl-req">' + fmt("rlGet", { p: state.req }) + '</div>' + levelCard(rank) +
        '<button class="rl-btn" type="button" data-act="complete">' + tr("rlCompleted") + '</button><button class="rl-link" type="button" data-act="giveup">' + tr("rlGiveUp") + '</button>';
    }
    view.innerHTML = html;
    view.querySelectorAll(".rl-list .rl-card").forEach((c, i) => c.style.setProperty("--i", Math.min(i, 10)));
  };

  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // After a level is cleared: go straight to the next random level (needs 1% more), or finish the run at 100% / when levels run out.
  const advance = () => {
    if (state.req < 100 && state.pos + 1 < state.order.length) { state.pos++; state.req++; state.status = "playing"; }
    else state.status = "finished";
  };
  syncState();
  if (state && state.status === "cleared") { advance(); save(); }

  // Level card slides in whenever a new level is drawn.
  const slideCard = () => { const c = view.querySelector(".rl-card"); if (c) c.classList.add("rl-slide"); };

  const actions = {
    start() {
      let a = clampRange($("rlFrom").value, 1), b = clampRange($("rlTo").value, TOP());
      if (a > b) [a, b] = [b, a];
      const pool = [], list = all();
      for (let r = a; r <= b; r++) if (list[r - 1] && list[r - 1].name) pool.push(list[r - 1].name);
      if (!pool.length) { $("rlMsg").textContent = tr("rlNoLevels"); return; }
      state = { status: "playing", start: a, end: b, order: shuffle(pool.slice()), pool: pool.slice(), pos: 0, req: 1, done: [] };
      save(); render(); slideCard();
    },
    complete() { state.done.push({ name: state.order[state.pos], percent: state.req }); advance(); save(); render();
      // Little pop animation on the "GET _%" text whenever the % goes up.
      if (state.status === "playing") { const el = view.querySelector(".rl-req"); if (el) el.classList.add("rl-bump"); slideCard(); }
    },
    giveup() {
      const finish = () => { state.status = "finished"; animateNext = true; save(); render(); };
      const card = view.querySelector(".rl-card");
      const reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
      if (!card || reduce) { finish(); return; }
      // Little "defeat" animation: the level shakes and falls away, then the results appear.
      card.classList.add("rl-fail");
      const req = view.querySelector(".rl-req"); if (req) req.classList.add("rl-failtext");
      view.querySelectorAll("button").forEach(b => { b.disabled = true; });
      setTimeout(finish, 650);
    },
    new() { state = null; save(); render(); }
  };

  view.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (b && !b.disabled && actions[b.dataset.act]) actions[b.dataset.act]();
  });
  // Range boxes: anything below 1 becomes 1, anything above the last spot becomes that spot.
  view.addEventListener("input", e => {
    const el = e.target;
    if (!el.classList.contains("rl-range") || el.value === "") return;
    const n = Number(el.value);
    if (isNaN(n)) return;
    if (n < 1) el.value = 1;
    else if (n > TOP()) el.value = TOP();
    else if (!Number.isInteger(n)) el.value = Math.floor(n);
  });
  view.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.classList.contains("rl-range")) actions.start();
  });

  const open = () => { syncState(); render(); overlay.hidden = false; document.body.style.overflow = "hidden"; };
  const close = () => { overlay.hidden = true; document.body.style.overflow = ""; };
  openBtn.addEventListener("click", open);
  closeBtn.addEventListener("click", close);
  overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !overlay.hidden) close(); });

  window.rouletteRefresh = () => {
    openBtn.title = tr("rlTitle"); openBtn.setAttribute("aria-label", tr("rlTitle"));
    if (!overlay.hidden) render();
  };
})();

  const ICON = {
    list: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h2v2H3zM7 5h14v2H7zM3 11h2v2H3zM7 11h14v2H7zM3 17h2v2H3zM7 17h14v2H7z"/></svg>',
    refresh: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg>',
    users: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11a3 3 0 1 0-3-3 3 3 0 0 0 3 3ZM8 11a3 3 0 1 0-3-3 3 3 0 0 0 3 3Zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13Zm8 0c-.4 0-.8 0-1.2.1 1.2.8 2.2 1.9 2.2 3.4V19h6v-2.5c0-2.3-4.700-3.500-7-3.500Z"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    wheel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M3.5 12h17M6 6l12 12M18 6 6 18"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9.500L4 20.500Z"/></svg>',
    discord: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.7 5.3A18 18 0 0 0 15.3 4l-.5 1a16 16 0 0 0-5.6 0l-.5-1a18 18 0 0 0-4.4 1.3C1.5 9.4.7 13.4 1.1 17.4a18 18 0 0 0 5.4 2.7l1.2-2a11 11 0 0 1-1.9-.9l.5-.4a12.800 12.800 0 0 0 11.400 0l.5.4a11 11 0 0 1-1.900.9l1.200 2a18 18 0 0 0 5.400-2.700c.5-4.700-.8-8.700-3.200-12.100ZM8.600 14.800c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2Zm6.800 0c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2Z"/></svg>',
    x: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.6 22H2.4l7.3-8.4L1.8 2h6.5l4.5 6.8L18.9 2Zm-1.1 18h1.7L7.3 3.9H5.5L17.8 20Z"/></svg>',
    people: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-3 0-8 1.500-8 4.500V21h16v-2.500C20 15.500 15 14 12 14Z"/></svg>',
    check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.400 9.500 8 11 4.600-1.500 8-6 8-11V5Zm-1.500 14.500-3.500-3.500 1.400-1.400 2.100 2.100 5-5 1.400 1.400Z"/></svg>'
  };

  const renderHome = () => {
    const named = all().filter(l => l.name);
    const levelsN = named.length;
    const why = [["people", "w1"], ["refresh", "w2"], ["check", "w3"], ["wheel", "w4"]].map(([ic, k]) =>
      '<div class="why-item"><div class="why-ico">' + (ic === "wheel" ? ICON.wheel.replace('fill="none" stroke="currentColor" stroke-width="1.9"', 'fill="none" stroke="var(--accent-text-2)" stroke-width="1.9"') : ICON[ic]) + '</div><div><h3>' + h(k + "t") + '</h3><p>' + h(k + "d") + '</p></div></div>').join("");
    homeEl.innerHTML =
      '<p class="hm-kicker">' + h("kicker") + '</p><h1 class="hm-headline">' + h("headline") + '</h1>' +
      '<div class="hm-stats">' +
        '<div class="hm-stat">' + ICON.list + '<b data-count="' + levelsN + '">' + levelsN + '</b><span>' + h("statLevels") + '</span></div>' +
        '<div class="hm-stat">' + ICON.refresh + '<b class="txt">' + h("statUpdatesVal") + '</b><span>' + h("statUpdates") + '</span></div>' +
        '<div class="hm-stat">' + ICON.users + '<b class="txt">' + h("statCommVal") + '</b><span>' + h("statComm") + '</span></div>' +
      '</div>' +
      '<div class="hm-actions">' +
        '<button class="hm-btn primary" type="button" data-go="list">' + h("explore") + ' ' + ICON.arrow + '</button>' +
        '<button class="hm-btn" type="button" data-go="roulette">' + h("roulette") + ' ' + ICON.wheel + '</button>' +
        '<a class="hm-btn" href="' + DISCORD + '" target="_blank" rel="noopener noreferrer">' + h("suggest") + ' ' + ICON.chat + '</a>' +
      '</div>' +
      '<div class="hm-social"><a class="hm-chip" href="' + DISCORD + '" target="_blank" rel="noopener noreferrer">' + ICON.discord + ' Discord</a><a class="hm-chip" href="' + X_LINK + '" target="_blank" rel="noopener noreferrer">' + ICON.x + ' X</a></div>' +
      '<div class="hm-grid"><section class="hm-panel"><h2>' + h("recent") + '</h2><div class="hm-scroll">' + recentHtml() + '</div></section>' +
      '<section class="hm-panel"><h2>' + h("why") + '</h2>' + why + '</section></div>';
    if (pendingAnim && !isList()) { pendingAnim = false; runCounts(); }
  };

  const runCounts = () => {
    const reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    if (reduce) return;
    homeEl.querySelectorAll("[data-count]").forEach(el => {
      const end = Number(el.dataset.count), t0 = performance.now(), dur = 900;
      el.textContent = "0";
      const step = now => { const p = Math.min((now - t0) / dur, 1); el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  };

  const apply = skipRender => {
    const list = isList();
    homeEl.hidden = list; listEl.hidden = !list;
    const shown = list ? listEl : homeEl;
    shown.classList.remove("view-in"); void shown.offsetWidth; shown.classList.add("view-in");
    if (!list) { pendingAnim = true; if (!skipRender) renderHome(); }
    window.scrollTo(0, 0);
  };

  const reduceMotion = () => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  const ripple = (btn, e) => {
    const r = btn.getBoundingClientRect(), size = Math.max(r.width, r.height) * 2.2;
    const x = (e.clientX || e.clientY) ? e.clientX - r.left : r.width / 2, y = (e.clientX || e.clientY) ? e.clientY - r.top : r.height / 2;
    const dot = document.createElement("span");
    dot.className = "hm-ripple";
    dot.style.cssText = "width:" + size + "px;height:" + size + "px;left:" + (x - size / 2) + "px;top:" + (y - size / 2) + "px";
    btn.appendChild(dot);
    setTimeout(() => dot.remove(), 650);
  };
  const flash = (btn, cls, ms) => { btn.classList.remove(cls); void btn.offsetWidth; btn.classList.add(cls); setTimeout(() => btn.classList.remove(cls), ms); };
  let busy = false;

  homeEl.addEventListener("click", e => {
    const btn = e.target.closest(".hm-btn"), go = e.target.closest("[data-go]"), find = e.target.closest("[data-find]");
    const still = reduceMotion();
    if (btn && !still) ripple(btn, e);
    if (go) {
      if (busy) return;
      if (go.dataset.go === "list") {
        // Explore: arrow shoots forward, the front page lifts away, then the list slides in.
        const toList = () => { homeEl.classList.remove("hm-leave"); busy = false; location.hash = "list"; apply(); };
        if (still) { toList(); return; }
        busy = true; flash(go, "hm-press", 500);
        setTimeout(() => { homeEl.classList.add("hm-leave"); setTimeout(toList, 280); }, 170);
      } else if (go.dataset.go === "roulette") {
        // Roulette: the wheel spins fast, then the roulette opens.
        if (still) { $("openRoulette").click(); return; }
        busy = true; flash(go, "hm-spin", 600);
        setTimeout(() => { busy = false; $("openRoulette").click(); }, 480);
      }
    } else if (find) {
      location.hash = "list"; apply();
      const q = $("search"); q.value = find.dataset.find; q.dispatchEvent(new Event("input"));
    } else if (btn && !still) {
      // Suggest a placement (link opens Discord): the chat bubble pops.
      flash(btn, "hm-pop", 600);
    }
  });
  $("logo").addEventListener("click", () => { if (isList()) { location.hash = "home"; apply(); } });
  window.addEventListener("hashchange", () => apply());
  window.isHomeView = () => !isList();
  window.showListView = () => { location.hash = "list"; apply(); };
  window.renderHome = renderHome;
  apply(true);
})();


displayLevels(levels, "main");
updateLanguageInterface();

// Header remains visible at all times while the page scrolls.
// Black crescent switches to a white sun and enables the site-wide dark theme.
(() => {
const toggle = document.getElementById('themeToggle');
if (!toggle) return;
const setDarkMode = (enabled) => {
document.body.classList.toggle('dark-mode', enabled);
toggle.setAttribute('aria-pressed', String(enabled));
toggle.setAttribute('aria-label', enabled ? tr('switchLight') : tr('switchDark'));
toggle.title = enabled ? tr('switchLight') : tr('switchDark');
try { localStorage.setItem('demonverseTheme', enabled ? 'dark' : 'light'); } catch (e) {}
};
let initialTheme = 'dark';
try {
const savedTheme = localStorage.getItem('demonverseTheme');
if (savedTheme === 'dark' || savedTheme === 'light') initialTheme = savedTheme;
} catch (e) {}
setDarkMode(initialTheme === 'dark');
toggle.addEventListener('click', () => setDarkMode(!document.body.classList.contains('dark-mode')));
})();
</script>

</body>
</html>
